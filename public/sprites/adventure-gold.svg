<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <defs>
    <!-- Gold Background Gradient -->
    <radialGradient id="goldBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#8D6E63" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#3E2723" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1A0C03"/>
    </radialGradient>

    <!-- Metallic Gold Body Gradient -->
    <linearGradient id="goldBodyGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="30%" stop-color="#FFD54F"/>
      <stop offset="70%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <!-- Metallic Gold Hood Gradient -->
    <linearGradient id="goldHoodGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>

    <!-- Gold Shimmer Overlay -->
    <linearGradient id="goldShimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFDE7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .el{transform-box:fill-box;transform-origin:center}
    .bob{animation:bob 2.8s ease-in-out infinite}
    .blink{animation:blink 3.8s steps(1,end) infinite}
    .shimmer{animation:shimmer 2.5s ease-in-out infinite}
    .glow{animation:glow 3s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%,98%{transform:scaleY(.1)}}
    @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
    @keyframes glow{0%,100%{opacity:.3}50%{opacity:.6}}
    @media(prefers-reduced-motion:reduce){.el{animation:none!important}}
  </style>

  <!-- Card background -->
  <rect width="128" height="128" rx="20" fill="url(#goldBg)"/>

  <!-- Ambient golden glow -->
  <ellipse class="glow" cx="64" cy="68" rx="48" ry="44" fill="#FFD54F"/>

  <g class="el bob">
    <!-- Drop Shadow under character -->
    <ellipse cx="64" cy="118" rx="26" ry="6" fill="#000000" opacity="0.5"/>

    <!-- CAPE -->
    <path d="M 32 64 C 28 80, 30 100, 36 110 L 92 110 C 98 100, 100 80, 96 64 Z" fill="#E65100"/>

    <!-- LEGS -->
    <rect x="42" y="104" width="13" height="10" rx="3" fill="#F57F17"/>
    <rect x="73" y="104" width="13" height="10" rx="3" fill="#E65100"/>

    <!-- GOLD BODY -->
    <path d="M 34 44 C 32 30, 94 30, 94 44 L 94 96 C 94 104, 34 104, 34 96 Z" fill="url(#goldBodyGrad)"/>
    <path d="M 34 44 C 32 30, 56 32, 46 98 C 36 98, 34 90, 34 44 Z" fill="#FFFDE7" opacity="0.6"/>
    <path d="M 76 34 C 86 38, 92 50, 94 96 C 84 98, 80 64, 76 34 Z" fill="#E65100" opacity="0.4"/>

    <!-- CHEST HARNESS & BELT -->
    <circle cx="64" cy="74" r="10" stroke="#E65100" stroke-width="2" fill="none" opacity="0.8"/>
    <line x1="64" y1="64" x2="64" y2="84" stroke="#E65100" stroke-width="1.5" opacity="0.6"/>

    <rect x="33" y="86" width="62" height="7" fill="#BF360C"/>
    <rect x="58" y="84" width="12" height="11" rx="2" fill="#FFD54F" stroke="#BF360C" stroke-width="1"/>
    <rect x="61" y="87" width="6" height="5" fill="#FFFDE7"/>

    <!-- STUBBY ARMS -->
    <path d="M 34 68 L 24 72 L 34 76 Z" fill="#F57F17"/>
    <path d="M 94 68 L 104 72 L 94 76 Z" fill="#E65100"/>

    <!-- GOLD HOODED COWL -->
    <path d="M 30 42 C 24 16, 104 16, 98 42 C 102 58, 86 68, 64 68 C 42 68, 26 58, 30 42 Z" fill="url(#goldHoodGrad)"/>
    <path d="M 30 42 C 24 16, 104 16, 98 42" stroke="#FFFDE7" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <path d="M 34 52 C 44 64, 84 64, 94 52 C 86 64, 44 64, 34 52 Z" fill="#F57F17"/>

    <!-- FACE -->
    <path d="M 38 42 C 36 28, 92 28, 90 42 C 90 52, 38 52, 38 42 Z" fill="#FFE082"/>

    <!-- Eyepatch Strap -->
    <line x1="36" y1="36" x2="90" y2="44" stroke="#3E2723" stroke-width="3" stroke-linecap="round"/>

    <!-- GOLD/DARK EYEPATCH -->
    <ellipse cx="48" cy="40" rx="10" ry="8" transform="rotate(-10 48 40)" fill="#3E2723"/>
    <ellipse cx="48" cy="40" rx="10" ry="8" transform="rotate(-10 48 40)" stroke="#5D4037" stroke-width="1.5"/>

    <!-- GLOWING CYAN EYE -->
    <g class="el blink">
      <ellipse cx="78" cy="42" rx="4.5" ry="6" fill="#00E5FF"/>
      <ellipse cx="78" cy="42" rx="2.5" ry="4" fill="#00838F"/>
      <circle cx="76" cy="39" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Brow -->
    <path d="M 70 36 Q 78 34 84 38" stroke="#3E2723" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Mouth -->
    <path d="M 64 50 L 70 52" stroke="#3E2723" stroke-width="2" stroke-linecap="round"/>

    <!-- Shimmer -->
    <rect class="shimmer" x="20" y="30" width="20" height="75" fill="url(#goldShimmerGrad)" transform="rotate(-30 40 60)" opacity="0.7"/>

  </g>
</svg>
