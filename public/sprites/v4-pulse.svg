<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <style>
    .el { transform-box: fill-box; transform-origin: center; }
    .bob { animation: bob 2.8s ease-in-out infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .spark { animation: spark 2s ease-in-out infinite; }
    .dash { animation: dash 1.6s ease-in-out infinite; }
    .halo { opacity: .14; animation: halo 2.8s ease-in-out infinite; pointer-events: none; }
    @keyframes halo { 0%,100% { opacity: .14; } 50% { opacity: .32; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: .85; } }
    @keyframes spark { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.25); opacity: .7; } }
    @keyframes dash { 0%,100% { transform: translateX(-3px); } 50% { transform: translateX(4px); } }
    @media (prefers-reduced-motion: reduce) { .el, .halo { animation: none !important; } }
  </style>
  <rect width="128" height="128" rx="28" fill="#1A3A1A"/>
  <ellipse class="halo" cx="64" cy="42" rx="42" ry="28" fill="#ffffff"/>
  <g class="el bob">
    <circle cx="64" cy="64" r="28" fill="#00FF7F" opacity=".2"/>
    <circle class="el pulse" cx="64" cy="64" r="22" fill="#00FF7F" opacity=".4"/>
    <circle cx="64" cy="64" r="16" fill="#32CD32"/>
    <circle cx="64" cy="64" r="8" fill="#98FB98"/>
    <path class="el dash" d="M40 64 L52 64 M76 64 L88 64" stroke="#00FF7F" stroke-width="3" stroke-linecap="round"/>
    <path class="el dash" d="M64 40 L64 52 M64 76 L64 88" stroke="#00FF7F" stroke-width="3" stroke-linecap="round"/>
    <circle class="el spark" cx="44" cy="44" r="3" fill="#90EE90"/>
    <circle class="el spark" cx="84" cy="80" r="2.5" fill="#90EE90"/>
  </g>
</svg>