<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <style>
    .el{transform-box:fill-box;transform-origin:center}
    .bob{animation:bob 2.8s ease-in-out infinite}
    .blink{animation:blink 3.8s steps(1,end) infinite}
    .glow{animation:glow 2s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes blink{0%,90%,100%{transform:scaleY(1)}93%,97%{transform:scaleY(.1)}}
    @keyframes glow{0%,100%{opacity:.12}50%{opacity:.3}}
    @media(prefers-reduced-motion:reduce){.el{animation:none!important}}
  </style>
  <rect width="128" height="128" rx="28" fill="#0a1628"/>
  <ellipse class="glow" cx="64" cy="58" rx="46" ry="38" fill="#5dade2" opacity=".18"/>
  <g class="el bob">
    <rect x="30" y="18" width="68" height="88" rx="12" fill="#2a6e91"/>
    <rect x="32" y="20" width="64" height="84" rx="10" fill="#5dade2"/>
    <rect x="38" y="26" width="52" height="42" rx="6" fill="#111"/>
    <rect x="41" y="29" width="46" height="36" rx="4" fill="#0a0a0a"/>
    <g class="el blink">
      <rect x="48" y="38" width="11" height="11" rx="2" fill="#fff"/>
      <rect x="69" y="38" width="11" height="11" rx="2" fill="#fff"/>
      <rect x="50" y="40" width="6" height="7" rx="1" fill="#111"/>
      <rect x="71" y="40" width="6" height="7" rx="1" fill="#111"/>
    </g>
    <path d="M50 55 Q64 66 78 55" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <line x1="54" y1="57" x2="54" y2="60" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="60" y1="59" x2="60" y2="62" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="68" y1="59" x2="68" y2="62" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="74" y1="57" x2="74" y2="60" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="40" y="76" width="6" height="18" rx="1.5" fill="#1a1a1a"/>
    <rect x="35" y="81" width="16" height="6" rx="1.5" fill="#1a1a1a"/>
    <circle cx="82" cy="82" r="4" fill="#9b59b6"/>
    <circle cx="90" cy="88" r="4" fill="#d4a017"/>
    <rect x="52" y="98" width="4" height="4" rx="1" fill="#1a1a1a"/>
    <rect x="60" y="98" width="4" height="4" rx="1" fill="#1a1a1a"/>
    <rect x="68" y="98" width="4" height="4" rx="1" fill="#1a1a1a"/>
    <rect x="38" y="106" width="8" height="6" rx="2" fill="#1a2a3a"/>
    <rect x="82" y="106" width="8" height="6" rx="2" fill="#1a2a3a"/>
    <rect x="56" y="14" width="16" height="6" rx="3" fill="#2a6e91"/>
  </g>
</svg>