<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <defs>
    <!-- Matrix Background Gradient -->
    <radialGradient id="matrixBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#052411" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#021007"/>
    </radialGradient>

    <!-- Matrix Green Body Gradient -->
    <linearGradient id="matrixBodyGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="50%" stop-color="#0B381E"/>
      <stop offset="100%" stop-color="#00240E"/>
    </linearGradient>

    <!-- Matrix Circuit Pattern -->
    <pattern id="matrixPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 8 H 16 M 8 0 V 16" stroke="#00E676" stroke-width="0.75" opacity="0.35"/>
      <circle cx="8" cy="8" r="1" fill="#69F0AE" opacity="0.6"/>
    </pattern>

    <!-- Eye Glow Filter -->
    <filter id="cheatEyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .el{transform-box:fill-box;transform-origin:center}
    .bob{animation:bob 2.8s ease-in-out infinite}
    .pulse-eye{animation:eyePulse 2.4s ease-in-out infinite alternate}
    .matrix-rain{animation:rain 4s linear infinite}
    .scanline{animation:scan 3s ease-in-out infinite}
    .glow{animation:glow 2.5s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes eyePulse{0%{opacity:.85;transform:scale(.98)}100%{opacity:1;transform:scale(1.03)}}
    @keyframes rain{0%{transform:translateY(-20px)}100%{transform:translateY(20px)}}
    @keyframes scan{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:.6;transform:translateY(40px)}}
    @keyframes glow{0%,100%{opacity:.3}50%{opacity:.6}}
    @media(prefers-reduced-motion:reduce){.el{animation:none!important}}
  </style>

  <!-- Card background -->
  <rect width="128" height="128" rx="20" fill="url(#matrixBg)"/>

  <!-- Matrix Binary Code Rain Background -->
  <g opacity="0.35" fill="#00E676" font-family="monospace" font-size="7" class="matrix-rain">
    <text x="10" y="15">01010101</text>
    <text x="32" y="35">11001010</text>
    <text x="80" y="20">10101100</text>
    <text x="102" y="40">00110101</text>
    <text x="14" y="65">10010011</text>
    <text x="96" y="80">01101101</text>
  </g>

  <!-- Ambient green glow behind Cheat Master Storm Scout -->
  <ellipse class="glow" cx="64" cy="68" rx="46" ry="42" fill="#00E676"/>

  <g class="el bob">
    <!-- Drop Shadow under character -->
    <ellipse cx="64" cy="118" rx="28" ry="6" fill="#000000" opacity="0.6"/>

    <!-- ===================== LEGS / STEPPED BASE ===================== -->
    <rect x="42" y="104" width="14" height="12" rx="3" fill="#052B14"/>
    <rect x="44" y="112" width="10" height="4" rx="2" fill="#00E676" opacity="0.7"/>
    <rect x="72" y="104" width="14" height="12" rx="3" fill="#031F0E"/>
    <rect x="74" y="112" width="10" height="4" rx="2" fill="#00E676" opacity="0.7"/>

    <!-- ===================== CURVED SEGMENTED MATRIX HORNS ===================== -->
    <!-- Left Horn -->
    <path d="M 38 42 C 30 38, 22 40, 18 46 C 16 50, 22 56, 32 50 Z" fill="#1B5E20" stroke="#00E676" stroke-width="1.2"/>
    <path d="M 28 42 C 20 36, 16 38, 14 44 C 18 48, 24 46, 26 44 Z" fill="#2E7D32" stroke="#69F0AE" stroke-width="1"/>
    <path d="M 24 38 C 16 32, 12 34, 10 40 C 14 44, 20 42, 22 40 Z" fill="#00E676" opacity="0.8"/>
    <path d="M 18 34 C 12 28, 10 26, 14 24 C 18 24, 18 30, 20 34 Z" fill="#B9F6CA"/>
    <path d="M 30 42 Q 22 46 26 50" stroke="#00E676" stroke-width="1.5" fill="none"/>
    <path d="M 24 38 Q 16 42 20 46" stroke="#00E676" stroke-width="1.5" fill="none"/>

    <!-- Right Horn -->
    <path d="M 90 42 C 98 38, 106 40, 110 46 C 112 50, 106 56, 96 50 Z" fill="#1B5E20" stroke="#00E676" stroke-width="1.2"/>
    <path d="M 100 42 C 108 36, 112 38, 114 44 C 110 48, 104 46, 102 44 Z" fill="#2E7D32" stroke="#69F0AE" stroke-width="1"/>
    <path d="M 104 38 C 112 32, 116 34, 118 40 C 114 44, 108 42, 106 40 Z" fill="#00E676" opacity="0.8"/>
    <path d="M 110 34 C 116 28, 118 26, 114 24 C 110 24, 110 30, 108 34 Z" fill="#B9F6CA"/>
    <path d="M 98 42 Q 106 46 102 50" stroke="#00E676" stroke-width="1.5" fill="none"/>
    <path d="M 104 38 Q 112 42 108 46" stroke="#00E676" stroke-width="1.5" fill="none"/>

    <!-- ===================== SIDE FINS ===================== -->
    <path d="M 32 68 L 22 72 L 32 76 Z" fill="#00E676" opacity="0.8"/>
    <path d="M 33 80 L 24 84 L 34 88 Z" fill="#00C853" opacity="0.8"/>
    <path d="M 35 92 L 26 95 L 36 98 Z" fill="#1B5E20"/>
    <path d="M 96 68 L 106 72 L 96 76 Z" fill="#00E676" opacity="0.8"/>
    <path d="M 95 80 L 104 84 L 94 88 Z" fill="#00C853" opacity="0.8"/>
    <path d="M 93 92 L 102 95 L 92 98 Z" fill="#1B5E20"/>

    <!-- ===================== BLOCKY CUBIC BODY ===================== -->
    <path d="M 36 40 C 34 30, 92 30, 92 40 L 96 102 C 96 108, 32 108, 32 102 Z" fill="url(#matrixBodyGrad)"/>
    <path d="M 36 40 C 34 30, 92 30, 92 40 L 96 102 C 96 108, 32 108, 32 102 Z" fill="url(#matrixPattern)"/>

    <!-- Digital Camouflage Patches -->
    <rect x="40" y="70" width="10" height="8" rx="2" fill="#00E676" opacity="0.4"/>
    <rect x="74" y="76" width="12" height="7" rx="2" fill="#69F0AE" opacity="0.4"/>
    <rect x="52" y="88" width="14" height="9" rx="2" fill="#00C853" opacity="0.5"/>

    <!-- Glowing Wireframe Outline -->
    <path d="M 36 40 C 34 30, 92 30, 92 40 L 96 102 C 96 108, 32 108, 32 102 Z" stroke="#00E676" stroke-width="1.5" fill="none" opacity="0.75"/>

    <!-- Digital Code Glyphs on Body (matching reference) -->
    <g fill="#00E676" font-family="monospace" font-size="7" opacity="0.7">
      <text x="44" y="80">日</text>
      <text x="68" y="76">中</text>
      <text x="56" y="94">1</text>
      <text x="76" y="92">0</text>
    </g>

    <!-- ===================== GLOWING PINK/MAGENTA TRIANGULAR EYES ===================== -->
    <g class="pulse-eye" filter="url(#cheatEyeGlow)">
      <polygon points="40,54 58,60 42,66" fill="#FF4081"/>
      <polygon points="43,56 55,60 44,64" fill="#FFFFFF"/>

      <polygon points="88,54 70,60 86,66" fill="#FF4081"/>
      <polygon points="85,56 73,60 84,64" fill="#FFFFFF"/>
    </g>

    <!-- MOUTH -->
    <path d="M 61 67 L 64 64 L 67 67" stroke="#FF4081" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Scanline effect -->
    <line class="scanline" x1="20" y1="50" x2="108" y2="50" stroke="#00E676" stroke-width="1.5" opacity="0.5"/>

  </g>
</svg>
