<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <defs>
    <!-- Matrix Background Gradient -->
    <radialGradient id="matrixBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#052411" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#021007"/>
    </radialGradient>

    <!-- Matrix Green Body Gradient -->
    <linearGradient id="matrixBodyGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="50%" stop-color="#0B381E"/>
      <stop offset="100%" stop-color="#00240E"/>
    </linearGradient>

    <!-- Matrix Pattern -->
    <pattern id="matrixPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 8 H 16 M 8 0 V 16" stroke="#00E676" stroke-width="0.75" opacity="0.35"/>
      <circle cx="8" cy="8" r="1" fill="#69F0AE" opacity="0.6"/>
    </pattern>

    <!-- Eye Glow Filter -->
    <filter id="cheatEyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .el{transform-box:fill-box;transform-origin:center}
    .bob{animation:bob 2.8s ease-in-out infinite}
    .blink{animation:blink 3.8s steps(1,end) infinite}
    .matrix-rain{animation:rain 4s linear infinite}
    .scanline{animation:scan 3s ease-in-out infinite}
    .glow{animation:glow 2.5s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%,98%{transform:scaleY(.1)}}
    @keyframes rain{0%{transform:translateY(-20px)}100%{transform:translateY(20px)}}
    @keyframes scan{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:.6;transform:translateY(40px)}}
    @keyframes glow{0%,100%{opacity:.3}50%{opacity:.6}}
    @media(prefers-reduced-motion:reduce){.el{animation:none!important}}
  </style>

  <!-- Card background -->
  <rect width="128" height="128" rx="20" fill="url(#matrixBg)"/>

  <!-- Matrix Binary Code Rain Background -->
  <g opacity="0.35" fill="#00E676" font-family="monospace" font-size="7" class="matrix-rain">
    <text x="10" y="15">01010101</text>
    <text x="32" y="35">11001010</text>
    <text x="80" y="20">10101100</text>
    <text x="102" y="40">00110101</text>
    <text x="14" y="65">10010011</text>
    <text x="96" y="80">01101101</text>
  </g>

  <!-- Ambient green glow -->
  <ellipse class="glow" cx="64" cy="68" rx="46" ry="42" fill="#00E676"/>

  <g class="el bob">
    <!-- Drop Shadow under character -->
    <ellipse cx="64" cy="118" rx="26" ry="6" fill="#000000" opacity="0.6"/>

    <!-- CAPE -->
    <path d="M 32 64 C 28 80, 30 100, 36 110 L 92 110 C 98 100, 100 80, 96 64 Z" fill="#00240E"/>

    <!-- LEGS -->
    <rect x="42" y="104" width="13" height="10" rx="3" fill="#052B14"/>
    <rect x="73" y="104" width="13" height="10" rx="3" fill="#031F0E"/>

    <!-- MATRIX BODY -->
    <path d="M 34 44 C 32 30, 94 30, 94 44 L 94 96 C 94 104, 34 104, 34 96 Z" fill="url(#matrixBodyGrad)"/>
    <path d="M 34 44 C 32 30, 94 30, 94 44 L 94 96 C 94 104, 34 104, 34 96 Z" fill="url(#matrixPattern)"/>

    <!-- Digital Camouflage Patches -->
    <rect x="40" y="70" width="10" height="8" rx="2" fill="#00E676" opacity="0.4"/>
    <rect x="74" y="76" width="12" height="7" rx="2" fill="#69F0AE" opacity="0.4"/>

    <path d="M 34 44 C 32 30, 94 30, 94 44 L 94 96 C 94 104, 34 104, 34 96 Z" stroke="#00E676" stroke-width="1.5" fill="none" opacity="0.75"/>

    <!-- CHEST HARNESS -->
    <circle cx="64" cy="74" r="10" stroke="#00E676" stroke-width="2" fill="none" opacity="0.8"/>
    <line x1="64" y1="64" x2="64" y2="84" stroke="#00E676" stroke-width="1.5" opacity="0.6"/>

    <!-- MATRIX HOODED COWL -->
    <path d="M 30 42 C 24 16, 104 16, 98 42 C 102 58, 86 68, 64 68 C 42 68, 26 58, 30 42 Z" fill="#1B5E20"/>
    <path d="M 30 42 C 24 16, 104 16, 98 42 C 102 58, 86 68, 64 68 C 42 68, 26 58, 30 42 Z" fill="url(#matrixPattern)"/>
    <path d="M 30 42 C 24 16, 104 16, 98 42" stroke="#00E676" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- FACE -->
    <path d="M 38 42 C 36 28, 92 28, 90 42 C 90 52, 38 52, 38 42 Z" fill="#A5D6A7"/>

    <!-- Eyepatch Strap -->
    <line x1="36" y1="36" x2="90" y2="44" stroke="#00240E" stroke-width="3" stroke-linecap="round"/>

    <!-- MATRIX EYEPATCH -->
    <ellipse cx="48" cy="40" rx="10" ry="8" transform="rotate(-10 48 40)" fill="#00240E"/>
    <ellipse cx="48" cy="40" rx="10" ry="8" transform="rotate(-10 48 40)" stroke="#00E676" stroke-width="1.5"/>

    <!-- GLOWING CYAN EYE -->
    <g class="el blink" filter="url(#cheatEyeGlow)">
      <ellipse cx="78" cy="42" rx="4.5" ry="6" fill="#00E5FF"/>
      <ellipse cx="78" cy="42" rx="2.5" ry="4" fill="#FFFFFF"/>
    </g>

    <!-- Brow -->
    <path d="M 70 36 Q 78 34 84 38" stroke="#1B5E20" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Mouth -->
    <path d="M 64 50 L 70 52" stroke="#1B5E20" stroke-width="2" stroke-linecap="round"/>

    <!-- Scanline -->
    <line class="scanline" x1="20" y1="50" x2="108" y2="50" stroke="#00E676" stroke-width="1.5" opacity="0.5"/>

  </g>
</svg>
