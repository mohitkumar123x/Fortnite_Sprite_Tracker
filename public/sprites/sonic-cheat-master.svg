<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <defs>
    <!-- Matrix Background Gradient -->
    <radialGradient id="matrixBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#052411" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#021007"/>
    </radialGradient>

    <!-- Matrix Green Body Gradient -->
    <linearGradient id="matrixBody" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="50%" stop-color="#0B381E"/>
      <stop offset="100%" stop-color="#00240E"/>
    </linearGradient>

    <!-- Glowing Green Circuit Pattern -->
    <pattern id="matrixPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 8 H 16 M 8 0 V 16" stroke="#00E676" stroke-width="0.75" opacity="0.35"/>
      <circle cx="8" cy="8" r="1" fill="#69F0AE" opacity="0.6"/>
    </pattern>

    <!-- Digital Matrix Skin Gradient -->
    <linearGradient id="matrixSkin" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#A5D6A7"/>
      <stop offset="100%" stop-color="#66BB6A"/>
    </linearGradient>
  </defs>

  <style>
    .el{transform-box:fill-box;transform-origin:center}
    .bob{animation:bob 2.8s ease-in-out infinite}
    .blink{animation:blink 3.8s steps(1,end) infinite}
    .matrix-rain{animation:rain 4s linear infinite}
    .scanline{animation:scan 3s ease-in-out infinite}
    .glow{animation:glow 2.5s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%,98%{transform:scaleY(.1)}}
    @keyframes rain{0%{transform:translateY(-20px)}100%{transform:translateY(20px)}}
    @keyframes scan{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:.6;transform:translateY(40px)}}
    @keyframes glow{0%,100%{opacity:.3}50%{opacity:.6}}
    @media(prefers-reduced-motion:reduce){.el{animation:none!important}}
  </style>

  <!-- Card background -->
  <rect width="128" height="128" rx="20" fill="url(#matrixBg)"/>

  <!-- Matrix Binary Code Rain Background -->
  <g opacity="0.35" fill="#00E676" font-family="monospace" font-size="7" class="matrix-rain">
    <text x="10" y="15">01010101</text>
    <text x="32" y="35">11001010</text>
    <text x="80" y="20">10101100</text>
    <text x="102" y="40">00110101</text>
    <text x="14" y="65">10010011</text>
    <text x="96" y="80">01101101</text>
  </g>

  <!-- Ambient green glow behind Sonic -->
  <ellipse class="glow" cx="64" cy="68" rx="46" ry="42" fill="#00E676"/>

  <g class="el bob">
    <!-- Drop Shadow under character -->
    <ellipse cx="64" cy="118" rx="26" ry="6" fill="#000000" opacity="0.6"/>

    <!-- MATRIX BACK QUILLS -->
    <path d="M 86 36 L 110 44 L 92 56 Z" fill="#1B5E20" stroke="#00E676" stroke-width="1"/>
    <path d="M 88 56 L 114 68 L 90 78 Z" fill="#0B381E" stroke="#00E676" stroke-width="1"/>
    <path d="M 84 76 L 106 88 L 82 94 Z" fill="#00240E" stroke="#00E676" stroke-width="1"/>

    <!-- MATRIX CHUNKY BODY -->
    <path d="M 32 36 C 30 20, 86 20, 88 36 L 90 94 C 90 106, 30 106, 30 94 Z" fill="url(#matrixBody)"/>
    <path d="M 32 36 C 30 20, 86 20, 88 36 L 90 94 C 90 106, 30 106, 30 94 Z" fill="url(#matrixPattern)"/>

    <!-- Digital Camouflage Patches -->
    <rect x="40" y="70" width="10" height="8" rx="2" fill="#00E676" opacity="0.4"/>
    <rect x="70" y="78" width="12" height="7" rx="2" fill="#69F0AE" opacity="0.4"/>
    <rect x="52" y="88" width="14" height="9" rx="2" fill="#00C853" opacity="0.5"/>

    <!-- Body Wireframe Outline -->
    <path d="M 32 36 C 30 20, 86 20, 88 36 L 90 94 C 90 106, 30 106, 30 94 Z" stroke="#00E676" stroke-width="1.5" fill="none" opacity="0.7"/>

    <!-- MATRIX EARS -->
    <path d="M 34 32 L 28 10 L 48 24 Z" fill="#1B5E20" stroke="#00E676" stroke-width="1"/>
    <path d="M 36 28 L 31 15 L 45 23 Z" fill="url(#matrixSkin)"/>
    <path d="M 72 24 L 90 10 L 84 32 Z" fill="#0B381E" stroke="#00E676" stroke-width="1"/>

    <!-- MATRIX BELLY -->
    <ellipse cx="46" cy="74" rx="15" ry="16" fill="url(#matrixSkin)"/>

    <!-- MATRIX MUZZLE -->
    <path d="M 28 44 C 24 58, 48 70, 68 62 C 78 58, 80 44, 68 40 C 56 36, 38 36, 28 44 Z" fill="url(#matrixSkin)"/>

    <!-- NOSE -->
    <ellipse cx="26" cy="50" rx="4" ry="3" fill="#00240E"/>

    <!-- SMILE -->
    <path d="M 34 58 Q 44 64 52 58" stroke="#1B5E20" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- CONNECTED EYES -->
    <path d="M 36 30 C 32 44, 52 52, 60 48 C 66 45, 78 44, 76 30 C 74 22, 58 22, 54 28 C 50 22, 38 22, 36 30 Z" fill="#C8E6C9"/>

    <!-- GLOWING GREEN MATRIX EYES -->
    <g class="el blink">
      <!-- Left Pupil -->
      <ellipse cx="46" cy="38" rx="4.5" ry="7" fill="#00E676"/>
      <ellipse cx="46" cy="38" rx="2.5" ry="5" fill="#00240E"/>
      <circle cx="44" cy="35" r="1.5" fill="#FFFFFF"/>

      <!-- Right Pupil -->
      <ellipse cx="64" cy="38" rx="4.5" ry="7" fill="#00E676"/>
      <ellipse cx="64" cy="38" rx="2.5" ry="5" fill="#00240E"/>
      <circle cx="62" cy="35" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- SHOES -->
    <rect x="36" y="94" width="12" height="12" rx="3" fill="#052B14"/>
    <rect x="32" y="102" width="18" height="12" rx="4" fill="#1B5E20" stroke="#00E676" stroke-width="1"/>
    <rect x="32" y="102" width="18" height="4" rx="2" fill="#69F0AE"/>

    <rect x="58" y="94" width="12" height="12" rx="3" fill="#031F0E"/>
    <rect x="56" y="102" width="18" height="12" rx="4" fill="#0B381E" stroke="#00E676" stroke-width="1"/>
    <rect x="56" y="102" width="18" height="4" rx="2" fill="#69F0AE"/>

    <!-- Scanline effect -->
    <line class="scanline" x1="20" y1="50" x2="108" y2="50" stroke="#00E676" stroke-width="1.5" opacity="0.5"/>

  </g>
</svg>
