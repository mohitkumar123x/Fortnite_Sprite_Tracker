<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <defs>
    <!-- Galaxy Background Gradient -->
    <radialGradient id="galaxyBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#E040FB" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#2D064A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0E021B"/>
    </radialGradient>

    <!-- Cosmic Purple Body Gradient -->
    <linearGradient id="cosmicBody" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#E040FB"/>
      <stop offset="35%" stop-color="#AA00FF"/>
      <stop offset="70%" stop-color="#7B1FA2"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </linearGradient>

    <!-- Nebula Cloud Texture Gradient -->
    <radialGradient id="nebulaSwirl" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF4081" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#E040FB" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7B1FA2" stop-opacity="0"/>
    </radialGradient>

    <!-- Peach Skin Gradient -->
    <linearGradient id="peachSkin" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="50%" stop-color="#FFCC80"/>
      <stop offset="100%" stop-color="#FFB74D"/>
    </linearGradient>
  </defs>

  <style>
    .el{transform-box:fill-box;transform-origin:center}
    .bob{animation:bob 2.8s ease-in-out infinite}
    .blink{animation:blink 3.8s steps(1,end) infinite}
    .galaxy-spin{animation:spin 16s linear infinite}
    .twinkle{animation:twinkle 2s ease-in-out infinite alternate}
    .glow{animation:glow 3s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%,98%{transform:scaleY(.1)}}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    @keyframes twinkle{0%{opacity:.2;transform:scale(.8)}100%{opacity:.9;transform:scale(1.2)}}
    @keyframes glow{0%,100%{opacity:.3}50%{opacity:.65}}
    @media(prefers-reduced-motion:reduce){.el{animation:none!important}}
  </style>

  <!-- Card background -->
  <rect width="128" height="128" rx="20" fill="url(#galaxyBg)"/>

  <!-- Swirling Nebula Galaxy Ring (Background swirl matching reference) -->
  <path class="galaxy-spin" d="M 64 20 A 48 48 0 1 1 63.9 20" stroke="url(#nebulaSwirl)" stroke-width="18" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- Twinkling Stars in background -->
  <g fill="#FFFFFF">
    <circle class="twinkle" cx="18" cy="22" r="1.5"/>
    <circle class="twinkle" cx="108" cy="28" r="1"/>
    <circle class="twinkle" cx="24" cy="98" r="1"/>
    <circle class="twinkle" cx="102" cy="94" r="1.5"/>
    <circle class="twinkle" cx="88" cy="18" r="1.2"/>
  </g>

  <!-- Ambient purple-magenta glow behind Sonic -->
  <ellipse class="glow" cx="64" cy="68" rx="46" ry="42" fill="#E040FB"/>

  <g class="el bob">
    <!-- Drop Shadow under character -->
    <ellipse cx="64" cy="118" rx="26" ry="6" fill="#000000" opacity="0.6"/>

    <!-- COSMIC BACK QUILLS -->
    <path d="M 86 36 L 110 44 L 92 56 Z" fill="#AA00FF"/>
    <path d="M 88 56 L 114 68 L 90 78 Z" fill="#7B1FA2"/>
    <path d="M 84 76 L 106 88 L 82 94 Z" fill="#4A148C"/>

    <!-- COSMIC CHUNKY BODY -->
    <path d="M 32 36 C 30 20, 86 20, 88 36 L 90 94 C 90 106, 30 106, 30 94 Z" fill="url(#cosmicBody)"/>

    <!-- Swirling Nebula Cloud Overlay on Body (matching reference) -->
    <path d="M 32 36 C 30 20, 86 20, 88 36 L 90 94 C 90 106, 30 106, 30 94 Z" fill="url(#nebulaSwirl)"/>

    <!-- Stardust sparkles on body -->
    <circle cx="48" cy="72" r="1" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="78" cy="82" r="1.2" fill="#FF80AB" opacity="0.9"/>
    <circle cx="60" cy="94" r="1" fill="#EA80FC" opacity="0.8"/>

    <!-- COSMIC EARS -->
    <path d="M 34 32 L 28 10 L 48 24 Z" fill="#AA00FF"/>
    <path d="M 36 28 L 31 15 L 45 23 Z" fill="url(#peachSkin)"/>
    <path d="M 72 24 L 90 10 L 84 32 Z" fill="#7B1FA2"/>

    <!-- PEACH BELLY OVAL -->
    <ellipse cx="46" cy="74" rx="15" ry="16" fill="url(#peachSkin)"/>

    <!-- PEACH MUZZLE -->
    <path d="M 28 44 C 24 58, 48 70, 68 62 C 78 58, 80 44, 68 40 C 56 36, 38 36, 28 44 Z" fill="url(#peachSkin)"/>

    <!-- NOSE -->
    <ellipse cx="26" cy="50" rx="4" ry="3" fill="#1C0136"/>

    <!-- SMILE -->
    <path d="M 34 58 Q 44 64 52 58" stroke="#4E2A00" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- CONNECTED WHITE EYES -->
    <path d="M 36 30 C 32 44, 52 52, 60 48 C 66 45, 78 44, 76 30 C 74 22, 58 22, 54 28 C 50 22, 38 22, 36 30 Z" fill="#FFFFFF"/>

    <!-- GREEN PUPILS -->
    <g class="el blink">
      <!-- Left Pupil -->
      <ellipse cx="46" cy="38" rx="4.5" ry="7" fill="#00C853"/>
      <ellipse cx="46" cy="38" rx="2.5" ry="5" fill="#1B5E20"/>
      <circle cx="44" cy="35" r="1.5" fill="#FFFFFF"/>

      <!-- Right Pupil -->
      <ellipse cx="64" cy="38" rx="4.5" ry="7" fill="#00C853"/>
      <ellipse cx="64" cy="38" rx="2.5" ry="5" fill="#1B5E20"/>
      <circle cx="62" cy="35" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- SHOES -->
    <rect x="36" y="94" width="12" height="12" rx="3" fill="#7B1FA2"/>
    <rect x="32" y="102" width="18" height="12" rx="4" fill="#E040FB"/>
    <rect x="32" y="102" width="18" height="4" rx="2" fill="#FFFFFF"/>

    <rect x="58" y="94" width="12" height="12" rx="3" fill="#4A148C"/>
    <rect x="56" y="102" width="18" height="12" rx="4" fill="#AA00FF"/>
    <rect x="56" y="102" width="18" height="4" rx="2" fill="#FFFFFF"/>

  </g>
</svg>
