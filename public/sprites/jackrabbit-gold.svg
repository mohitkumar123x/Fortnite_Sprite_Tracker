<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <defs>
    <!-- Gold Backdrop Gradient -->
    <radialGradient id="goldJackBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="35%" stop-color="#FFB300"/>
      <stop offset="70%" stop-color="#8F5E00"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </radialGradient>

    <!-- Metallic Gold Body Gradient -->
    <linearGradient id="goldBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="25%" stop-color="#FBC02D"/>
      <stop offset="60%" stop-color="#F57F17"/>
      <stop offset="85%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>

    <!-- Gold Face / Muzzle Gradient -->
    <linearGradient id="goldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="50%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </linearGradient>

    <!-- Gold Inner Ear Gradient -->
    <linearGradient id="goldEarInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>

    <!-- Gold Shimmer Overlay Gradient -->
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .el{transform-box:fill-box;transform-origin:center}
    .bob{animation:bob 2.8s ease-in-out infinite}
    .blink{animation:blink 3.8s steps(1,end) infinite}
    .ear-twitch{animation:twitch 3.2s ease-in-out infinite alternate}
    .shimmer{animation:shimmer 2.5s linear infinite}
    .sparkle{animation:sparkle 2s ease-in-out infinite alternate}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%,98%{transform:scaleY(.1)}}
    @keyframes twitch{0%,90%,100%{transform:rotate(0deg)}94%{transform:rotate(-4deg)}97%{transform:rotate(3deg)}}
    @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
    @keyframes sparkle{0%{opacity:.3;transform:scale(.8)}100%{opacity:1;transform:scale(1.2)}}
    @media(prefers-reduced-motion:reduce){.el{animation:none!important}}
  </style>

  <!-- Card Background -->
  <rect width="128" height="128" rx="20" fill="url(#goldJackBg)"/>

  <!-- Background Rays / Sparkles -->
  <g opacity="0.35">
    <polygon points="64,64 -10,-10 30,-10" fill="#FFF59D"/>
    <polygon points="64,64 138,-10 138,30" fill="#FFF59D"/>
    <polygon points="64,64 138,138 98,138" fill="#FFF59D"/>
    <polygon points="64,64 -10,138 -10,98" fill="#FFF59D"/>
  </g>

  <!-- Ambient Gold Glow -->
  <ellipse cx="64" cy="68" rx="46" ry="42" fill="#FFE082" opacity="0.3"/>

  <g class="el bob">
    <!-- Drop Shadow -->
    <ellipse cx="64" cy="118" rx="26" ry="6" fill="#000000" opacity="0.5"/>

    <!-- LEGS -->
    <rect x="42" y="104" width="13" height="10" rx="3" fill="#E65100"/>
    <rect x="73" y="104" width="13" height="10" rx="3" fill="#BF360C"/>

    <!-- GOLD CHUNKY BODY -->
    <path d="M 34 38 C 32 24, 94 24, 94 38 L 94 96 C 94 104, 34 104, 34 96 Z" fill="url(#goldBody)"/>
    <!-- Body Highlights -->
    <path d="M 34 38 C 32 24, 56 26, 46 98 C 36 98, 34 90, 34 38 Z" fill="#FFFDE7" opacity="0.5"/>
    <path d="M 76 28 C 86 32, 92 44, 94 96 C 84 98, 80 58, 76 28 Z" fill="#BF360C" opacity="0.4"/>

    <!-- GOLD BELLY PATCH -->
    <ellipse cx="64" cy="74" rx="18" ry="20" fill="url(#goldFace)"/>

    <!-- STUBBY ARMS -->
    <path d="M 34 68 L 24 72 L 34 76 Z" fill="#FFB300"/>
    <path d="M 94 68 L 104 72 L 94 76 Z" fill="#F57F17"/>

    <!-- ===================== GOLD EARS ===================== -->
    <g class="el ear-twitch">
      <!-- Left Ear -->
      <path d="M 44 26 C 38 6, 42 -4, 48 4 C 54 12, 52 24, 54 26 Z" fill="#F57F17"/>
      <path d="M 44 24 C 40 8, 44 2, 48 8 C 51 14, 50 22, 51 24 Z" fill="url(#goldEarInner)"/>

      <!-- Right Ear -->
      <path d="M 74 26 C 76 24, 74 12, 80 4 C 86 -4, 90 6, 84 26 Z" fill="#E65100"/>
      <path d="M 77 24 C 78 22, 77 14, 80 8 C 84 2, 88 8, 84 24 Z" fill="url(#goldEarInner)"/>

      <!-- Hair Tuft -->
      <ellipse cx="64" cy="22" rx="7" ry="5" fill="#FFD54F"/>
    </g>

    <!-- ===================== GOLD HEADBAND ===================== -->
    <rect x="31" y="24" width="66" height="8" rx="2" fill="#FF6F00"/>
    <rect x="31" y="24" width="66" height="3" rx="1" fill="#FFE082" opacity="0.8"/>

    <!-- ===================== GOLD BUNNY FACE ===================== -->
    <path d="M 36 32 C 34 22, 92 22, 92 32 C 92 58, 36 58, 36 32 Z" fill="url(#goldFace)"/>

    <!-- NOSE -->
    <ellipse cx="64" cy="46" rx="3.5" ry="2.5" fill="#BF360C"/>

    <!-- BUCK TEETH -->
    <rect x="60" y="52" width="3.5" height="5" rx="1" fill="#FFFFFF" stroke="#F57F17" stroke-width="0.5"/>
    <rect x="64.5" y="52" width="3.5" height="5" rx="1" fill="#FFFFFF" stroke="#F57F17" stroke-width="0.5"/>

    <!-- SMILE LINE -->
    <path d="M 54 48 Q 64 54 74 48" stroke="#BF360C" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- ===================== EXPRESSIVE EYES ===================== -->
    <path d="M 44 28 C 40 40, 56 44, 62 42 C 68 40, 84 40, 82 28 C 80 22, 66 22, 63 26 C 60 22, 46 22, 44 28 Z" fill="#FFFFFF"/>

    <!-- CYAN PUPILS WITH GOLD REFLECTIONS -->
    <g class="el blink">
      <!-- Left Pupil -->
      <ellipse cx="52" cy="34" rx="4" ry="6" fill="#00E5FF"/>
      <ellipse cx="52" cy="34" rx="2.5" ry="4" fill="#00838F"/>
      <circle cx="50" cy="31" r="1.5" fill="#FFFFFF"/>

      <!-- Right Pupil -->
      <ellipse cx="72" cy="34" rx="4" ry="6" fill="#00E5FF"/>
      <ellipse cx="72" cy="34" rx="2.5" ry="4" fill="#00838F"/>
      <circle cx="70" cy="31" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Brow -->
    <path d="M 44 24 Q 52 20 60 25 Q 68 20 78 24" stroke="#BF360C" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- GOLD SPARKLES -->
    <path class="sparkle" d="M 28 40 L 30 44 L 34 46 L 30 48 L 28 52 L 26 48 L 22 46 L 26 44 Z" fill="#FFF59D"/>
    <path class="sparkle" style="animation-delay:0.8s" d="M 98 32 L 99.5 35 L 102.5 36.5 L 99.5 38 L 98 41 L 96.5 38 L 93.5 36.5 L 96.5 35 Z" fill="#FFFFFF"/>
  </g>
</svg>
