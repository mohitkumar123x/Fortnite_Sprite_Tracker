<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <defs>
    <!-- Background Gradient (Dark Purple/Violet to Deep Black matching reference) -->
    <radialGradient id="sonicBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#4A148C" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#210936" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0E031A"/>
    </radialGradient>

    <!-- Sonic Blue Body Gradient -->
    <linearGradient id="sonicBlue" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="40%" stop-color="#0288D1"/>
      <stop offset="80%" stop-color="#01579B"/>
      <stop offset="100%" stop-color="#002984"/>
    </linearGradient>

    <!-- Peach Muzzle / Belly Gradient -->
    <linearGradient id="peachSkin" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="50%" stop-color="#FFCC80"/>
      <stop offset="100%" stop-color="#FFB74D"/>
    </linearGradient>
  </defs>

  <style>
    .el{transform-box:fill-box;transform-origin:center}
    .bob{animation:bob 2.8s ease-in-out infinite}
    .blink{animation:blink 3.8s steps(1,end) infinite}
    .glow{animation:glow 3s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%,98%{transform:scaleY(.1)}}
    @keyframes glow{0%,100%{opacity:.25}50%{opacity:.5}}
    @media(prefers-reduced-motion:reduce){.el{animation:none!important}}
  </style>

  <!-- Card background -->
  <rect width="128" height="128" rx="20" fill="url(#sonicBg)"/>

  <!-- Ambient blue glow behind Sonic -->
  <ellipse class="glow" cx="64" cy="68" rx="46" ry="42" fill="#0288D1"/>

  <g class="el bob">
    <!-- Drop Shadow under character -->
    <ellipse cx="64" cy="118" rx="26" ry="6" fill="#000000" opacity="0.5"/>

    <!-- ===================== BACK QUILLS (3 Spikes on Right/Back) ===================== -->
    <!-- Top quill -->
    <path d="M 86 36 L 110 44 L 92 56 Z" fill="#01579B"/>
    <path d="M 86 36 L 110 44 L 90 48 Z" fill="#0288D1"/>
    <!-- Middle quill -->
    <path d="M 88 56 L 114 68 L 90 78 Z" fill="#002984"/>
    <path d="M 88 56 L 114 68 L 92 68 Z" fill="#01579B"/>
    <!-- Bottom quill -->
    <path d="M 84 76 L 106 88 L 82 94 Z" fill="#001B52"/>

    <!-- ===================== CHUNKY BLOCKY BODY (Cobalt Blue) ===================== -->
    <path d="M 32 36 C 30 20, 86 20, 88 36 L 90 94 C 90 106, 30 106, 30 94 Z" fill="url(#sonicBlue)"/>
    <!-- Body Left Highlight -->
    <path d="M 32 36 C 30 20, 56 22, 46 96 C 34 94, 30 84, 32 36 Z" fill="#4FC3F7" opacity="0.45"/>
    <!-- Body Right Shading -->
    <path d="M 72 26 C 84 32, 88 50, 88 94 C 76 96, 74 60, 72 26 Z" fill="#001B52" opacity="0.4"/>

    <!-- ===================== POINTED HEDGEHOG EARS ===================== -->
    <!-- Left Ear -->
    <path d="M 34 32 L 28 10 L 48 24 Z" fill="#0288D1"/>
    <path d="M 36 28 L 31 15 L 45 23 Z" fill="url(#peachSkin)"/>
    <!-- Right Ear -->
    <path d="M 72 24 L 90 10 L 84 32 Z" fill="#01579B"/>
    <path d="M 75 23 L 87 15 L 82 28 Z" fill="#FFB74D"/>

    <!-- ===================== PEACH BELLY OVAL ===================== -->
    <ellipse cx="46" cy="74" rx="15" ry="16" fill="url(#peachSkin)"/>
    <ellipse cx="44" cy="72" rx="12" ry="13" fill="#FFE0B2" opacity="0.6"/>

    <!-- ===================== PEACH MUZZLE & FACE MASK ===================== -->
    <!-- Classic Sonic connected eye/muzzle peach region -->
    <path d="M 28 44 C 24 58, 48 70, 68 62 C 78 58, 80 44, 68 40 C 56 36, 38 36, 28 44 Z" fill="url(#peachSkin)"/>

    <!-- ===================== NOSE ===================== -->
    <ellipse cx="26" cy="50" rx="4" ry="3" fill="#111111"/>
    <ellipse cx="25" cy="49" rx="1.5" ry="1" fill="#FFFFFF" opacity="0.8"/>

    <!-- ===================== SMILE ===================== -->
    <path d="M 34 58 Q 44 64 52 58" stroke="#4E2A00" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- ===================== CONNECTED WHITE SONIC EYES ===================== -->
    <path d="M 36 30 C 32 44, 52 52, 60 48 C 66 45, 78 44, 76 30 C 74 22, 58 22, 54 28 C 50 22, 38 22, 36 30 Z" fill="#FFFFFF"/>
    <path d="M 38 32 C 35 42, 50 48, 56 45 C 60 43, 72 42, 72 32 Z" fill="#F5F5F5"/>

    <!-- ===================== GREEN PUPILS (ICONIC SONIC EYES) ===================== -->
    <g class="el blink">
      <!-- Left Pupil -->
      <ellipse cx="46" cy="38" rx="4.5" ry="7" fill="#00C853"/>
      <ellipse cx="46" cy="38" rx="2.5" ry="5" fill="#1B5E20"/>
      <circle cx="44" cy="35" r="1.5" fill="#FFFFFF"/>
      <circle cx="47" cy="41" r="0.8" fill="#FFFFFF"/>

      <!-- Right Pupil -->
      <ellipse cx="64" cy="38" rx="4.5" ry="7" fill="#00C853"/>
      <ellipse cx="64" cy="38" rx="2.5" ry="5" fill="#1B5E20"/>
      <circle cx="62" cy="35" r="1.5" fill="#FFFFFF"/>
      <circle cx="65" cy="41" r="0.8" fill="#FFFFFF"/>
    </g>

    <!-- Brow outline -->
    <path d="M 34 26 Q 46 22 56 28 Q 66 22 78 26" stroke="#01579B" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- ===================== STUBBY ARMS / HANDS ===================== -->
    <!-- Left arm -->
    <ellipse cx="26" cy="72" rx="7" ry="5" transform="rotate(-20 26 72)" fill="url(#peachSkin)"/>
    <rect x="18" y="70" width="6" height="7" rx="3" stroke="#FFFFFF" stroke-width="2" fill="#FFFFFF"/>
    <!-- Right arm cuff sticking out -->
    <rect x="80" y="70" width="8" height="6" rx="3" fill="#FFFFFF"/>

    <!-- ===================== BLOCKY LEGS & RED SONIC SHOES ===================== -->
    <!-- Left leg stub -->
    <rect x="36" y="94" width="12" height="12" rx="3" fill="#0288D1"/>
    <!-- Left Shoe -->
    <rect x="32" y="102" width="18" height="12" rx="4" fill="#D32F2F"/>
    <rect x="32" y="102" width="18" height="4" rx="2" fill="#FFFFFF"/>
    <rect x="34" y="108" width="14" height="2" fill="#FFEB3B"/>

    <!-- Right leg stub -->
    <rect x="58" y="94" width="12" height="12" rx="3" fill="#01579B"/>
    <!-- Right Shoe -->
    <rect x="56" y="102" width="18" height="12" rx="4" fill="#C62828"/>
    <rect x="56" y="102" width="18" height="4" rx="2" fill="#FFFFFF"/>
    <rect x="58" y="108" width="14" height="2" fill="#FBC02D"/>

  </g>
</svg>