<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <style>
    .el { transform-box: fill-box; transform-origin: center; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .scan { animation: scan 3s ease-in-out infinite; }
    .glow { animation: glow 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: .85; } }
    @keyframes scan { 0%,100% { transform: translateY(0); opacity: .6; } 50% { transform: translateY(8px); opacity: 1; } }
    @keyframes glow { 0%,100% { opacity: .14; } 50% { opacity: .32; } }
    @media (prefers-reduced-motion: reduce) { .el { animation: none !important; } }
  </style>
  <rect width="128" height="128" rx="28" fill="#4a1a1a"/>
  <circle class="el glow" cx="64" cy="64" r="44" fill="#ff5252" opacity=".3"/>
  <g class="el pulse">
    <circle cx="64" cy="64" r="32" fill="none" stroke="#ff5252" stroke-width="3" opacity=".9"/>
    <circle cx="64" cy="64" r="20" fill="none" stroke="#ff5252" stroke-width="2" opacity=".7"/>
    <circle cx="64" cy="64" r="8" fill="#ff5252"/>
    <line class="el scan" x1="64" y1="20" x2="64" y2="108" stroke="#ff5252" stroke-width="2" opacity=".6"/>
    <line class="el scan" x1="20" y1="64" x2="108" y2="64" stroke="#ff5252" stroke-width="2" opacity=".6"/>
    <text x="64" y="68" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">CM</text>
  </g>
</svg>