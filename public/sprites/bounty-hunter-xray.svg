<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <defs>
    <!-- Galaxy Background Gradient -->
    <radialGradient id="galaxyBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#E040FB" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#2D064A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0E021B"/>
    </radialGradient>

    <!-- Cosmic Purple Coat Gradient -->
    <linearGradient id="cosmicCoat" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#E040FB"/>
      <stop offset="35%" stop-color="#AA00FF"/>
      <stop offset="70%" stop-color="#7B1FA2"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </linearGradient>

    <!-- Nebula Cloud Texture Gradient -->
    <radialGradient id="nebulaSwirl" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF4081" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#E040FB" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7B1FA2" stop-opacity="0"/>
    </radialGradient>

    <!-- Head Skin Gradient -->
    <linearGradient id="cosmicSkin" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#F5CBA7"/>
      <stop offset="100%" stop-color="#E1BEE7"/>
    </linearGradient>
  </defs>

  <style>
    .el{transform-box:fill-box;transform-origin:center}
    .bob{animation:bob 2.8s ease-in-out infinite}
    .blink{animation:blink 3.8s steps(1,end) infinite}
    .galaxy-spin{animation:spin 16s linear infinite}
    .twinkle{animation:twinkle 2s ease-in-out infinite alternate}
    .glow{animation:glow 3s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%,98%{transform:scaleY(.1)}}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    @keyframes twinkle{0%{opacity:.2;transform:scale(.8)}100%{opacity:.9;transform:scale(1.2)}}
    @keyframes glow{0%,100%{opacity:.3}50%{opacity:.65}}
    @media(prefers-reduced-motion:reduce){.el{animation:none!important}}
  </style>

  <!-- Background card background with dark cosmic galaxy gradient -->
  <rect width="128" height="128" rx="20" fill="url(#galaxyBg)"/>

  <!-- Swirling Nebula Galaxy Ring (Background swirl matching reference) -->
  <path class="galaxy-spin" d="M 64 20 A 48 48 0 1 1 63.9 20" stroke="url(#nebulaSwirl)" stroke-width="18" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- Twinkling Stars in background -->
  <g fill="#FFFFFF">
    <circle class="twinkle" cx="18" cy="22" r="1.5"/>
    <circle class="twinkle" cx="108" cy="28" r="1"/>
    <circle class="twinkle" cx="24" cy="98" r="1"/>
    <circle class="twinkle" cx="102" cy="94" r="1.5"/>
    <circle class="twinkle" cx="88" cy="18" r="1.2"/>
  </g>

  <!-- Ambient purple-magenta glow behind X-Ray -->
  <ellipse class="glow" cx="64" cy="68" rx="46" ry="42" fill="#E040FB"/>

  <g class="el bob">
    <!-- Drop Shadow under character -->
    <ellipse cx="64" cy="118" rx="28" ry="6" fill="#000000" opacity="0.6"/>

    <!-- ===================== LEGS / FEET ===================== -->
    <rect x="47" y="108" width="13" height="9" rx="4" fill="#260446"/>
    <rect x="67" y="108" width="13" height="9" rx="4" fill="#17012E"/>
    <rect x="44" y="113" width="17" height="4" rx="2" fill="#E040FB" opacity="0.8"/>
    <rect x="66" y="113" width="17" height="4" rx="2" fill="#FF4081" opacity="0.8"/>

    <!-- ===================== CHUBBY BLOB BODY (Cosmic Galaxy Coat) ===================== -->
    <path d="M 34 76 C 32 50, 96 50, 94 76 C 96 106, 32 106, 34 76 Z" fill="url(#cosmicCoat)"/>

    <!-- Swirling Nebula Cloud Overlay on Coat (matching reference) -->
    <path d="M 34 76 C 32 50, 96 50, 94 76 C 96 106, 32 106, 34 76 Z" fill="url(#nebulaSwirl)"/>

    <!-- Stardust sparkles on coat -->
    <circle cx="48" cy="72" r="1" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="78" cy="82" r="1.2" fill="#FF80AB" opacity="0.9"/>
    <circle cx="60" cy="94" r="1" fill="#EA80FC" opacity="0.8"/>

    <!-- Coat Highlight & Shadow -->
    <path d="M 34 76 C 32 50, 60 50, 50 104 C 36 102, 32 90, 34 76 Z" fill="#31005D" opacity="0.5"/>
    <path d="M 80 56 C 90 65, 94 80, 90 98 C 94 92, 94 72, 80 56 Z" fill="#F8BBD0" opacity="0.7"/>

    <!-- ===================== GLOWING DEEP VIOLET UNDER-SHIRT ===================== -->
    <path d="M 56 64 L 64 82 L 72 64 Z" fill="#4A148C"/>
    <path d="M 60 64 L 64 80 L 68 64 Z" fill="#31005D"/>

    <!-- Coat Lapels -->
    <path d="M 44 58 L 56 64 L 52 86 L 40 76 Z" fill="#8E24AA"/>
    <path d="M 44 58 L 56 64 L 50 82 Z" fill="#AB47BC"/>
    <path d="M 84 58 L 72 64 L 76 86 L 88 76 Z" fill="#6A1B9A"/>
    <path d="M 84 58 L 72 64 L 78 82 Z" fill="#8E24AA"/>
    <line x1="64" y1="82" x2="64" y2="108" stroke="#E040FB" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- ===================== STUBBY ARMS ===================== -->
    <ellipse cx="28" cy="80" rx="9" ry="6" transform="rotate(-25 28 80)" fill="#8E24AA"/>
    <ellipse cx="27" cy="80" rx="7" ry="4" transform="rotate(-25 27 80)" fill="#AB47BC"/>
    <ellipse cx="100" cy="80" rx="9" ry="6" transform="rotate(25 100 80)" fill="#6A1B9A"/>
    <ellipse cx="101" cy="80" rx="7" ry="4" transform="rotate(25 101 80)" fill="#8E24AA"/>

    <!-- ===================== HEAD / FACE ===================== -->
    <ellipse cx="64" cy="48" rx="25" ry="20" fill="url(#cosmicSkin)"/>

    <!-- ===================== WHITE BEARD WITH PINK GLOW ===================== -->
    <path d="M 52 64 Q 64 74 76 64 Q 72 76 64 76 Q 56 76 52 64 Z" fill="#FFFFFF"/>
    <ellipse cx="64" cy="72" rx="10" ry="4" fill="#F8BBD0"/>

    <!-- ===================== SMILE ===================== -->
    <path d="M 58 60 Q 64 64 70 60" stroke="#31005D" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- ===================== RED/MAGENTA GLASSES (MATCHES REFERENCE) ===================== -->
    <!-- Temple bars -->
    <line x1="28" y1="46" x2="38" y2="46" stroke="#D50000" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="100" y1="46" x2="90" y2="46" stroke="#D50000" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Bridge -->
    <rect x="57" y="44" width="14" height="4" rx="2" fill="#FF3D00"/>
    <rect x="58" y="45" width="12" height="2" rx="1" fill="#FF6E40"/>

    <!-- LEFT GLASSES FRAME -->
    <circle cx="44" cy="46" r="15" fill="#D50000"/>
    <circle cx="44" cy="46" r="12" fill="#140224"/>
    <!-- Frame highlight ring -->
    <path d="M 33 42 A 13.5 13.5 0 0 1 54 37" stroke="#FF4081" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- RIGHT GLASSES FRAME -->
    <circle cx="84" cy="46" r="15" fill="#D50000"/>
    <circle cx="84" cy="46" r="12" fill="#140224"/>
    <!-- Frame highlight ring -->
    <path d="M 73 42 A 13.5 13.5 0 0 1 94 37" stroke="#FF4081" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- ===================== EYES (DEEP COSMIC LAVENDER HIGHLIGHTS) ===================== -->
    <g class="el blink">
      <!-- Left Eye -->
      <circle cx="44" cy="46" r="9" fill="#0C0017"/>
      <circle cx="41" cy="43" r="3.5" fill="#FFFFFF"/>
      <circle cx="47" cy="49" r="1.5" fill="#EA80FC"/>

      <!-- Right Eye -->
      <circle cx="84" cy="46" r="9" fill="#0C0017"/>
      <circle cx="81" cy="43" r="3.5" fill="#FFFFFF"/>
      <circle cx="87" cy="49" r="1.5" fill="#EA80FC"/>
    </g>

    <!-- Glass Lens Glare -->
    <path d="M 34 40 Q 42 36 50 42" stroke="#F8BBD0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 74 40 Q 82 36 90 42" stroke="#F8BBD0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  </g>
</svg>