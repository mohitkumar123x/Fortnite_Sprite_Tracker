<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" aria-hidden="true">

  <defs>

    <!-- =========================
         BACKGROUND
    ========================== -->

    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#4A1B6E"/>
      <stop offset="55%" stop-color="#2A0C46"/>
      <stop offset="100%" stop-color="#150527"/>
    </radialGradient>


    <!-- =========================
         HEAD
    ========================== -->

    <linearGradient id="headPink" x1="15%" y1="5%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFA6E8"/>
      <stop offset="25%" stop-color="#E64BFC"/>
      <stop offset="58%" stop-color="#C93BE8"/>
      <stop offset="82%" stop-color="#A62BC8"/>
      <stop offset="100%" stop-color="#7C1E9E"/>
    </linearGradient>

    <linearGradient id="headHighlight" x1="0%" y1="0%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#FFD1F5"/>
      <stop offset="35%" stop-color="#F97BE0"/>
      <stop offset="100%" stop-color="#9B3EC0"/>
    </linearGradient>

    <linearGradient id="sidePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97BE0"/>
      <stop offset="45%" stop-color="#C93BE8"/>
      <stop offset="100%" stop-color="#5E1A7E"/>
    </linearGradient>


    <!-- =========================
         EYES
    ========================== -->

    <radialGradient id="eyeOuter" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#55eaff"/>
      <stop offset="35%" stop-color="#0bbbdc"/>
      <stop offset="72%" stop-color="#0085b9"/>
      <stop offset="100%" stop-color="#004f83"/>
    </radialGradient>

    <radialGradient id="eyeInner" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#273d4c"/>
      <stop offset="35%" stop-color="#081a28"/>
      <stop offset="100%" stop-color="#00070d"/>
    </radialGradient>


    <!-- =========================
         BODY
    ========================== -->

    <linearGradient id="bodyPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F263E8"/>
      <stop offset="35%" stop-color="#C93BC8"/>
      <stop offset="70%" stop-color="#9C2CB4"/>
      <stop offset="100%" stop-color="#5E1A7E"/>
    </linearGradient>

    <linearGradient id="bodyScreen" x1="15%" y1="5%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#f8f7f2"/>
      <stop offset="45%" stop-color="#e7e6e2"/>
      <stop offset="100%" stop-color="#aaa8aa"/>
    </linearGradient>


    <!-- =========================
         TEETH
    ========================== -->

    <linearGradient id="teeth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff9dc"/>
      <stop offset="60%" stop-color="#ded3b5"/>
      <stop offset="100%" stop-color="#a89b82"/>
    </linearGradient>


    <!-- =========================
         FINS
    ========================== -->

    <linearGradient id="fin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFB3EC"/>
      <stop offset="45%" stop-color="#D06BFF"/>
      <stop offset="100%" stop-color="#B8A2FF"/>
    </linearGradient>


    <!-- =========================
         FILTERS
    ========================== -->

    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <filter id="smallBlur">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>


    <!-- =========================
         HEAD TEXTURE
    ========================== -->

    <pattern id="cracks" width="52" height="48" patternUnits="userSpaceOnUse">

      <path
        d="
          M7 4 L13 9 L11 15 L19 20
          M33 2 L28 10 L31 17 L25 23
          M44 25 L38 30 L41 37
          M9 31 L16 27 L20 34 L16 42
          M29 39 L34 33 L30 28
        "
        fill="none"
        stroke="#5E1A7E"
        stroke-width="1.3"
        opacity=".30"
      />

      <path
        d="
          M14 12 L20 14 L22 10
          M32 17 L36 21 L34 26
        "
        fill="none"
        stroke="#FFD1F5"
        stroke-width="1"
        opacity=".20"
      />

    </pattern>


    <!-- =========================
         HEAD CLIP
    ========================== -->

    <clipPath id="headClip">
      <path
        d="
          M74 113
          Q82 83 113 73
          L384 82
          Q423 88 432 120
          L448 208
          Q452 239 426 253
          L104 257
          Q62 251 58 221
          Z
        "
      />
    </clipPath>

    <!-- DEFSFX -->

  </defs>


  <style>
    .el{transform-box:fill-box;transform-origin:center}
    .bob{transform-box:fill-box;transform-origin:center;animation:bob 2.8s ease-in-out infinite}
    .blink{animation:blink 4.2s steps(1,end) infinite}
    .glow{animation:glow 3.4s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%,98.5%{transform:scaleY(.08)}}
    @keyframes glow{0%,100%{opacity:.14}50%{opacity:.3}}
    .swirl{transform-box:fill-box;transform-origin:center;animation:swirl 9s ease-in-out infinite}
    @keyframes swirl{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(4deg) scale(1.03)}}
    .twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
    @keyframes twinkle{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(.45);opacity:.35}}
    .twinkle-2{transform-box:fill-box;transform-origin:center;animation:twinkle-2 3.4s ease-in-out infinite}
    @keyframes twinkle-2{0%,100%{transform:scale(.5);opacity:.4}50%{transform:scale(1.15);opacity:1}}
    @media(prefers-reduced-motion:reduce){.el,.bob,.spark,.rain,.scanline,.scan,.scan-slow,.swirl,.twinkle,.twinkle-2{animation:none!important}}
  </style>


