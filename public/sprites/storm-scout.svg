<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <defs>
    <!-- Background Gradient (Dark Blue-Grey/Black matching reference) -->
    <radialGradient id="stormBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0277BD" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#0B192C" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020813"/>
    </radialGradient>

    <!-- Storm Scout Body Gradient (Cyan Top fading to Magenta Bottom) -->
    <linearGradient id="stormBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="35%" stop-color="#00B0FF"/>
      <stop offset="70%" stop-color="#AA00FF"/>
      <stop offset="100%" stop-color="#7B1FA2"/>
    </linearGradient>

    <!-- Left Horn Gradient -->
    <linearGradient id="hornLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80DEEA"/>
      <stop offset="50%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#7B1FA2"/>
    </linearGradient>

    <!-- Right Horn Gradient -->
    <linearGradient id="hornRightGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80DEEA"/>
      <stop offset="50%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#7B1FA2"/>
    </linearGradient>

    <!-- Eye Glow Filter -->
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .el{transform-box:fill-box;transform-origin:center}
    .bob{animation:bob 2.8s ease-in-out infinite}
    .pulse-eye{animation:eyePulse 2.4s ease-in-out infinite alternate}
    .storm-flicker{animation:flicker 3s ease-in-out infinite alternate}
    .glow{animation:glow 3s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes eyePulse{0%{opacity:.85;transform:scale(.98)}100%{opacity:1;transform:scale(1.03)}}
    @keyframes flicker{0%{opacity:.5}50%{opacity:.85}100%{opacity:.6}}
    @keyframes glow{0%,100%{opacity:.2}50%{opacity:.45}}
    @media(prefers-reduced-motion:reduce){.el{animation:none!important}}
  </style>

  <!-- Background card -->
  <rect width="128" height="128" rx="20" fill="url(#stormBg)"/>

  <!-- Ambient cyan/purple storm aura glow -->
  <ellipse class="glow" cx="64" cy="68" rx="46" ry="42" fill="#00E5FF"/>

  <g class="el bob">
    <!-- Drop Shadow under character -->
    <ellipse cx="64" cy="118" rx="28" ry="6" fill="#000000" opacity="0.6"/>

    <!-- ===================== LEGS / STEPPED BASE ===================== -->
    <rect x="42" y="104" width="14" height="12" rx="3" fill="#4A148C"/>
    <rect x="44" y="112" width="10" height="4" rx="2" fill="#311B92"/>
    <rect x="72" y="104" width="14" height="12" rx="3" fill="#311B92"/>
    <rect x="74" y="112" width="10" height="4" rx="2" fill="#1A237E"/>

    <!-- ===================== CURVED SEGMENTED BEAST HORNS ===================== -->
    <!-- Left Horn (Segmented / Ribbed curling outwards) -->
    <!-- Base Segment -->
    <path d="M 38 42 C 30 38, 22 40, 18 46 C 16 50, 22 56, 32 50 Z" fill="url(#hornLeftGrad)"/>
    <!-- Middle Ridge 1 -->
    <path d="M 28 42 C 20 36, 16 38, 14 44 C 18 48, 24 46, 26 44 Z" fill="#80DEEA"/>
    <!-- Middle Ridge 2 -->
    <path d="M 24 38 C 16 32, 12 34, 10 40 C 14 44, 20 42, 22 40 Z" fill="#00E5FF"/>
    <!-- Horn Tip (curves slightly upward) -->
    <path d="M 18 34 C 12 28, 10 26, 14 24 C 18 24, 18 30, 20 34 Z" fill="#E0F7FA"/>
    <!-- Left horn ridges highlight lines -->
    <path d="M 30 42 Q 22 46 26 50" stroke="#00E5FF" stroke-width="1.5" fill="none"/>
    <path d="M 24 38 Q 16 42 20 46" stroke="#00E5FF" stroke-width="1.5" fill="none"/>
    <path d="M 18 34 Q 12 36 16 40" stroke="#80DEEA" stroke-width="1.5" fill="none"/>

    <!-- Right Horn (Segmented / Ribbed curling outwards) -->
    <!-- Base Segment -->
    <path d="M 90 42 C 98 38, 106 40, 110 46 C 112 50, 106 56, 96 50 Z" fill="url(#hornRightGrad)"/>
    <!-- Middle Ridge 1 -->
    <path d="M 100 42 C 108 36, 112 38, 114 44 C 110 48, 104 46, 102 44 Z" fill="#80DEEA"/>
    <!-- Middle Ridge 2 -->
    <path d="M 104 38 C 112 32, 116 34, 118 40 C 114 44, 108 42, 106 40 Z" fill="#00E5FF"/>
    <!-- Horn Tip -->
    <path d="M 110 34 C 116 28, 118 26, 114 24 C 110 24, 110 30, 108 34 Z" fill="#E0F7FA"/>
    <!-- Right horn ridges highlight lines -->
    <path d="M 98 42 Q 106 46 102 50" stroke="#00E5FF" stroke-width="1.5" fill="none"/>
    <path d="M 104 38 Q 112 42 108 46" stroke="#00E5FF" stroke-width="1.5" fill="none"/>
    <path d="M 110 34 Q 116 36 112 40" stroke="#80DEEA" stroke-width="1.5" fill="none"/>

    <!-- ===================== SIDE FINS / SPUR SPIKES ===================== -->
    <!-- Left Fins -->
    <path d="M 32 68 L 22 72 L 32 76 Z" fill="#00B0FF"/>
    <path d="M 33 80 L 24 84 L 34 88 Z" fill="#7C4DFF"/>
    <path d="M 35 92 L 26 95 L 36 98 Z" fill="#AA00FF"/>
    <!-- Right Fins -->
    <path d="M 96 68 L 106 72 L 96 76 Z" fill="#0091EA"/>
    <path d="M 95 80 L 104 84 L 94 88 Z" fill="#651FFF"/>
    <path d="M 93 92 L 102 95 L 92 98 Z" fill="#7B1FA2"/>

    <!-- ===================== BLOCKY CUBIC BODY ===================== -->
    <!-- Main torso container: rounded rectangle with slight 3D perspective -->
    <path d="M 36 40 C 34 30, 92 30, 92 40 L 96 102 C 96 108, 32 108, 32 102 Z" fill="url(#stormBodyGrad)"/>

    <!-- 3D Depth Edges (Left Highlight, Right Shadow) -->
    <path d="M 36 40 C 34 30, 56 32, 46 104 C 36 104, 32 94, 36 40 Z" fill="#E0F7FA" opacity="0.35"/>
    <path d="M 78 34 C 88 38, 94 48, 96 102 C 86 104, 82 70, 78 34 Z" fill="#311B92" opacity="0.5"/>

    <!-- Top Cap Bevel Highlight -->
    <path d="M 38 40 C 44 34, 84 34, 90 40 C 84 43, 44 43, 38 40 Z" fill="#FFFFFF" opacity="0.5"/>

    <!-- ===================== STORM VEINS / LIGHTNING FILAMENTS ===================== -->
    <g class="storm-flicker" stroke="#260342" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.75">
      <!-- Main trunk left -->
      <path d="M 44 58 Q 40 70 42 82 Q 46 90 44 100"/>
      <path d="M 42 74 Q 48 82 46 94"/>
      <path d="M 41 68 Q 36 76 38 88"/>
      <!-- Main trunk center/right -->
      <path d="M 84 58 Q 88 70 86 82 Q 82 90 84 100"/>
      <path d="M 86 74 Q 80 82 82 94"/>
      <path d="M 87 68 Q 92 76 90 88"/>
      <!-- Lower body energy branches -->
      <path d="M 52 86 Q 64 94 62 104"/>
      <path d="M 76 86 Q 64 94 66 104"/>
    </g>

    <!-- Cyan Glow highlight on veins -->
    <g stroke="#00E5FF" stroke-width="0.75" stroke-linecap="round" fill="none" opacity="0.6">
      <path d="M 45 60 Q 41 71 43 83"/>
      <path d="M 83 60 Q 87 71 85 83"/>
    </g>

    <!-- ===================== GLOWING TRIANGULAR EYES ===================== -->
    <g class="pulse-eye" filter="url(#eyeGlow)">
      <!-- Left Eye: Sharp inward-pointing triangle `>` -->
      <polygon points="40,54 58,60 42,66" fill="#FF4081"/>
      <polygon points="43,56 55,60 44,64" fill="#FFFFFF"/>

      <!-- Right Eye: Sharp inward-pointing triangle `<` -->
      <polygon points="88,54 70,60 86,66" fill="#FF4081"/>
      <polygon points="85,56 73,60 84,64" fill="#FFFFFF"/>
    </g>

    <!-- ===================== TINY CUTE BEAST MOUTH ===================== -->
    <!-- Inverted `^` notch right below and between the eyes -->
    <path d="M 61 67 L 64 64 L 67 67" stroke="#FF4081" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Subtle brow ridge shadow -->
    <path d="M 38 48 Q 50 44 64 47 Q 78 44 90 48" stroke="#0091EA" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  </g>
</svg>
