<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <defs>
    <!-- Background Gradient (Warm Dark Amber/Brown) -->
    <radialGradient id="jackBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#E65100" stop-opacity="0.3"/>
      <stop offset="55%" stop-color="#2E1C0A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#140C04"/>
    </radialGradient>

    <!-- Vibrant Green Body Gradient -->
    <linearGradient id="greenBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#7CB342"/>
      <stop offset="40%" stop-color="#558B2F"/>
      <stop offset="80%" stop-color="#33691E"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>

    <!-- Lime Face & Muzzle Gradient -->
    <linearGradient id="limeFace" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#DCE775"/>
      <stop offset="60%" stop-color="#C0CA33"/>
      <stop offset="100%" stop-color="#9CCC65"/>
    </linearGradient>

    <!-- Pale Lime Belly Gradient -->
    <linearGradient id="paleBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F4C3"/>
      <stop offset="100%" stop-color="#C5E1A5"/>
    </linearGradient>

    <!-- Pink Ear Lining Gradient -->
    <linearGradient id="pinkEar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF80AB"/>
      <stop offset="100%" stop-color="#F48FB1"/>
    </linearGradient>
  </defs>

  <style>
    .el{transform-box:fill-box;transform-origin:center}
    .bob{animation:bob 2.8s ease-in-out infinite}
    .blink{animation:blink 3.8s steps(1,end) infinite}
    .ear-twitch{animation:twitch 3.2s ease-in-out infinite alternate}
    .glow{animation:glow 3s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%,98%{transform:scaleY(.1)}}
    @keyframes twitch{0%,90%,100%{transform:rotate(0deg)}94%{transform:rotate(-4deg)}97%{transform:rotate(3deg)}}
    @keyframes glow{0%,100%{opacity:.25}50%{opacity:.5}}
    @media(prefers-reduced-motion:reduce){.el{animation:none!important}}
  </style>

  <!-- Card background -->
  <rect width="128" height="128" rx="20" fill="url(#jackBg)"/>

  <!-- Ambient green glow -->
  <ellipse class="glow" cx="64" cy="68" rx="46" ry="42" fill="#7CB342"/>

  <g class="el bob">
    <!-- Drop Shadow under character -->
    <ellipse cx="64" cy="118" rx="26" ry="6" fill="#000000" opacity="0.5"/>

    <!-- LEGS -->
    <rect x="42" y="104" width="13" height="10" rx="3" fill="#33691E"/>
    <rect x="73" y="104" width="13" height="10" rx="3" fill="#1B5E20"/>

    <!-- CHUNKY GREEN BODY -->
    <path d="M 34 38 C 32 24, 94 24, 94 38 L 94 96 C 94 104, 34 104, 34 96 Z" fill="url(#greenBody)"/>
    <!-- Body Left Highlight -->
    <path d="M 34 38 C 32 24, 56 26, 46 98 C 36 98, 34 90, 34 38 Z" fill="#AED581" opacity="0.45"/>
    <!-- Body Right Shading -->
    <path d="M 76 28 C 86 32, 92 44, 94 96 C 84 98, 80 58, 76 28 Z" fill="#1B5E20" opacity="0.4"/>

    <!-- PALE LIME BELLY PATCH -->
    <ellipse cx="64" cy="74" rx="18" ry="20" fill="url(#paleBelly)"/>

    <!-- STUBBY ARMS / SIDE FINS -->
    <path d="M 34 68 L 24 72 L 34 76 Z" fill="#7CB342"/>
    <path d="M 94 68 L 104 72 L 94 76 Z" fill="#558B2F"/>

    <!-- ===================== TALL RABBIT EARS (SIGNATURE FEATURE) ===================== -->
    <g class="el ear-twitch">
      <!-- Left Ear (Erect, tall) -->
      <path d="M 44 26 C 38 6, 42 -4, 48 4 C 54 12, 52 24, 54 26 Z" fill="#558B2F"/>
      <path d="M 44 24 C 40 8, 44 2, 48 8 C 51 14, 50 22, 51 24 Z" fill="url(#pinkEar)"/>

      <!-- Right Ear (Erect, angled right) -->
      <path d="M 74 26 C 76 24, 74 12, 80 4 C 86 -4, 90 6, 84 26 Z" fill="#33691E"/>
      <path d="M 77 24 C 78 22, 77 14, 80 8 C 84 2, 88 8, 84 24 Z" fill="url(#pinkEar)"/>

      <!-- Fluffy Hair Tuft between ears -->
      <ellipse cx="64" cy="22" rx="7" ry="5" fill="#7CB342"/>
    </g>

    <!-- ===================== RED HEADBAND (SIGNATURE FEATURE) ===================== -->
    <rect x="31" y="24" width="66" height="8" rx="2" fill="#D32F2F"/>
    <rect x="31" y="24" width="66" height="3" rx="1" fill="#FF5252" opacity="0.6"/>

    <!-- ===================== LIME GREEN BUNNY FACE ===================== -->
    <path d="M 36 32 C 34 22, 92 22, 92 32 C 92 58, 36 58, 36 32 Z" fill="url(#limeFace)"/>

    <!-- NOSE -->
    <ellipse cx="64" cy="46" rx="3.5" ry="2.5" fill="#33691E"/>

    <!-- BUCK TEETH (TWO WHITE TEETH STICKING DOWN) -->
    <rect x="60" y="52" width="3.5" height="5" rx="1" fill="#FFFFFF" stroke="#9CCC65" stroke-width="0.5"/>
    <rect x="64.5" y="52" width="3.5" height="5" rx="1" fill="#FFFFFF" stroke="#9CCC65" stroke-width="0.5"/>

    <!-- SMILE LINE -->
    <path d="M 54 48 Q 64 54 74 48" stroke="#33691E" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- ===================== CONNECTED EXPRESSIVE EYES ===================== -->
    <path d="M 44 28 C 40 40, 56 44, 62 42 C 68 40, 84 40, 82 28 C 80 22, 66 22, 63 26 C 60 22, 46 22, 44 28 Z" fill="#FFFFFF"/>

    <!-- CYAN PUPILS -->
    <g class="el blink">
      <!-- Left Pupil -->
      <ellipse cx="52" cy="34" rx="4" ry="6" fill="#00E5FF"/>
      <ellipse cx="52" cy="34" rx="2.5" ry="4" fill="#00838F"/>
      <circle cx="50" cy="31" r="1.5" fill="#FFFFFF"/>

      <!-- Right Pupil -->
      <ellipse cx="72" cy="34" rx="4" ry="6" fill="#00E5FF"/>
      <ellipse cx="72" cy="34" rx="2.5" ry="4" fill="#00838F"/>
      <circle cx="70" cy="31" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Brow -->
    <path d="M 44 24 Q 52 20 60 25 Q 68 20 78 24" stroke="#33691E" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  </g>
</svg>
