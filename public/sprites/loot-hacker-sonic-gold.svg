<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <style>.el{transform-box:fill-box;transform-origin:center}.bob{animation:bob 2.8s ease-in-out infinite}.dash{animation:dash 1.6s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes dash{0%,100%{transform:translateX(-3px)}50%{transform:translateX(4px)}}@media(prefers-reduced-motion:reduce){.el{animation:none!important}}</style>
  <rect width="128" height="128" rx="28" fill="#3a3a1a"/>
  <g class="el bob"><circle cx="64" cy="56" r="24" fill="#ffd54f"/><circle cx="56" cy="52" r="6" fill="#fff"/><circle cx="72" cy="52" r="6" fill="#fff"/><circle cx="56" cy="52" r="3" fill="#3a3a1a"/><circle cx="72" cy="52" r="3" fill="#3a3a1a"/><path d="M56 66Q64 74 72 66" stroke="#3a3a1a" stroke-width="2" fill="none"/><g class="el dash"><ellipse cx="40" cy="64" rx="8" ry="4" fill="#ffd54f" opacity=".5"/><ellipse cx="88" cy="64" rx="8" ry="4" fill="#ffd54f" opacity=".5"/></g></g>
</svg>