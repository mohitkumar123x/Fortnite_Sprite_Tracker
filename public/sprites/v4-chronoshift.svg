<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <style>
    .el { transform-box: fill-box; transform-origin: center; }
    .bob { animation: bob 2.8s ease-in-out infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .spark { animation: spark 2s ease-in-out infinite; }
    .spin { animation: spin 12s linear infinite; }
    .spin-rev { animation: spin 16s linear infinite reverse; }
    .halo { opacity: .14; animation: halo 2.8s ease-in-out infinite; pointer-events: none; }
    @keyframes halo { 0%,100% { opacity: .14; } 50% { opacity: .32; } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: .85; } }
    @keyframes spark { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.25); opacity: .7; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .el, .halo { animation: none !important; } }
  </style>
  <rect width="128" height="128" rx="28" fill="#0A1A3D"/>
  <ellipse class="halo" cx="64" cy="42" rx="42" ry="28" fill="#ffffff"/>
  <g class="el bob">
    <circle class="el spin" cx="64" cy="64" r="32" fill="none" stroke="#4169E1" stroke-width="3" stroke-dasharray="12 6"/>
    <circle class="el spin-rev" cx="64" cy="64" r="24" fill="none" stroke="#6495ED" stroke-width="2" stroke-dasharray="8 4"/>
    <circle cx="64" cy="64" r="16" fill="#1E3A8A"/>
    <circle cx="64" cy="64" r="10" fill="#4169E1"/>
    <path d="M56 52 L64 64 L72 52" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M56 76 L64 64 L72 76" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="el spark" cx="40" cy="48" r="3" fill="#87CEEB"/>
    <circle class="el spark" cx="88" cy="76" r="2.5" fill="#87CEEB"/>
  </g>
</svg>