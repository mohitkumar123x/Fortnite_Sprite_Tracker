<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <defs>
    <!-- Cyber Magenta/Purple Backdrop -->
    <radialGradient id="lootHackerJackBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#D500F9" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#4A148C"/>
      <stop offset="100%" stop-color="#1A0033"/>
    </radialGradient>

    <!-- Cyan Body Gradient -->
    <linearGradient id="cyberBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#2979FF"/>
    </linearGradient>

    <!-- Lime Face & Muzzle Gradient -->
    <linearGradient id="cyberLimeFace" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#EEFF41"/>
      <stop offset="60%" stop-color="#C6FF00"/>
      <stop offset="100%" stop-color="#76FF03"/>
    </linearGradient>

    <!-- Cyber Ear Gradient -->
    <linearGradient id="cyberEar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E040FB"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
  </defs>

  <style>
    .el{transform-box:fill-box;transform-origin:center}
    .bob{animation:bob 2.8s ease-in-out infinite}
    .blink{animation:blink 3.8s steps(1,end) infinite}
    .ear-twitch{animation:twitch 3.2s ease-in-out infinite alternate}
    .cyber-pulse{animation:pulse 2s ease-in-out infinite alternate}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%,98%{transform:scaleY(.1)}}
    @keyframes twitch{0%,90%,100%{transform:rotate(0deg)}94%{transform:rotate(-4deg)}97%{transform:rotate(3deg)}}
    @keyframes pulse{0%{opacity:0.4}100%{opacity:0.9}}
    @media(prefers-reduced-motion:reduce){.el{animation:none!important}}
  </style>

  <!-- Card Background -->
  <rect width="128" height="128" rx="20" fill="url(#lootHackerJackBg)"/>

  <!-- Cyber Grid Lines in Backdrop -->
  <g stroke="#E040FB" stroke-width="0.5" opacity="0.35">
    <line x1="0" y1="20" x2="128" y2="20"/>
    <line x1="0" y1="40" x2="128" y2="40"/>
    <line x1="0" y1="60" x2="128" y2="60"/>
    <line x1="0" y1="80" x2="128" y2="80"/>
    <line x1="0" y1="100" x2="128" y2="100"/>
    <line x1="20" y1="0" x2="20" y2="128"/>
    <line x1="40" y1="0" x2="40" y2="128"/>
    <line x1="60" y1="0" x2="60" y2="128"/>
    <line x1="80" y1="0" x2="80" y2="128"/>
    <line x1="100" y1="0" x2="100" y2="128"/>
  </g>

  <!-- Ambient Neon Cyan Glow -->
  <ellipse cx="64" cy="68" rx="46" ry="42" fill="#00E5FF" opacity="0.25"/>

  <g class="el bob">
    <!-- Drop Shadow -->
    <ellipse cx="64" cy="118" rx="26" ry="6" fill="#000000" opacity="0.6"/>

    <!-- LEGS -->
    <rect x="42" y="104" width="13" height="10" rx="3" fill="#1565C0"/>
    <rect x="73" y="104" width="13" height="10" rx="3" fill="#0D47A1"/>

    <!-- CYAN CYBER CHUNKY BODY -->
    <path d="M 34 38 C 32 24, 94 24, 94 38 L 94 96 C 94 104, 34 104, 34 96 Z" fill="url(#cyberBody)"/>

    <!-- Magenta Digital Block Texture / Circuit Lines on Body -->
    <g class="cyber-pulse" stroke="#FF4081" stroke-width="0.8" opacity="0.6">
      <rect x="38" y="44" width="8" height="6" fill="none"/>
      <rect x="82" y="44" width="8" height="6" fill="none"/>
      <rect x="40" y="80" width="10" height="8" fill="none"/>
      <rect x="78" y="80" width="10" height="8" fill="none"/>
      <line x1="46" y1="47" x2="82" y2="47"/>
      <line x1="50" y1="84" x2="78" y2="84"/>
    </g>

    <!-- PALE LIME / CYAN BELLY PATCH -->
    <ellipse cx="64" cy="74" rx="18" ry="20" fill="url(#cyberLimeFace)" opacity="0.85"/>

    <!-- STUBBY ARMS -->
    <path d="M 34 68 L 24 72 L 34 76 Z" fill="#00E5FF"/>
    <path d="M 94 68 L 104 72 L 94 76 Z" fill="#00B0FF"/>

    <!-- ===================== CYBER RABBIT EARS ===================== -->
    <g class="el ear-twitch">
      <!-- Left Ear -->
      <path d="M 44 26 C 38 6, 42 -4, 48 4 C 54 12, 52 24, 54 26 Z" fill="#00B0FF"/>
      <path d="M 44 24 C 40 8, 44 2, 48 8 C 51 14, 50 22, 51 24 Z" fill="url(#cyberEar)"/>

      <!-- Right Ear -->
      <path d="M 74 26 C 76 24, 74 12, 80 4 C 86 -4, 90 6, 84 26 Z" fill="#2979FF"/>
      <path d="M 77 24 C 78 22, 77 14, 80 8 C 84 2, 88 8, 84 24 Z" fill="url(#cyberEar)"/>

      <!-- Hair Tuft -->
      <ellipse cx="64" cy="22" rx="7" ry="5" fill="#00E5FF"/>
    </g>

    <!-- ===================== MAGENTA / RED HEADBAND ===================== -->
    <rect x="31" y="24" width="66" height="8" rx="2" fill="#FF1744"/>
    <rect x="31" y="24" width="66" height="3" rx="1" fill="#FF80AB" opacity="0.8"/>

    <!-- ===================== LIME GREEN BUNNY FACE ===================== -->
    <path d="M 36 32 C 34 22, 92 22, 92 32 C 92 58, 36 58, 36 32 Z" fill="url(#cyberLimeFace)"/>

    <!-- NOSE -->
    <ellipse cx="64" cy="46" rx="3.5" ry="2.5" fill="#33691E"/>

    <!-- BUCK TEETH -->
    <rect x="60" y="52" width="3.5" height="5" rx="1" fill="#FFFFFF" stroke="#76FF03" stroke-width="0.5"/>
    <rect x="64.5" y="52" width="3.5" height="5" rx="1" fill="#FFFFFF" stroke="#76FF03" stroke-width="0.5"/>

    <!-- SMILE LINE -->
    <path d="M 54 48 Q 64 54 74 48" stroke="#33691E" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- ===================== EXPRESSIVE CONNECTED EYES ===================== -->
    <path d="M 44 28 C 40 40, 56 44, 62 42 C 68 40, 84 40, 82 28 C 80 22, 66 22, 63 26 C 60 22, 46 22, 44 28 Z" fill="#FFFFFF"/>

    <!-- CYAN PUPILS -->
    <g class="el blink">
      <!-- Left Pupil -->
      <ellipse cx="52" cy="34" rx="4" ry="6" fill="#00E5FF"/>
      <ellipse cx="52" cy="34" rx="2.5" ry="4" fill="#00838F"/>
      <circle cx="50" cy="31" r="1.5" fill="#FFFFFF"/>

      <!-- Right Pupil -->
      <ellipse cx="72" cy="34" rx="4" ry="6" fill="#00E5FF"/>
      <ellipse cx="72" cy="34" rx="2.5" ry="4" fill="#00838F"/>
      <circle cx="70" cy="31" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Brow -->
    <path d="M 44 24 Q 52 20 60 25 Q 68 20 78 24" stroke="#33691E" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
