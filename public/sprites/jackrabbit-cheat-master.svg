<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <defs>
    <!-- Matrix Green Backdrop -->
    <radialGradient id="matrixJackBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1B5E20" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#052E0B"/>
      <stop offset="100%" stop-color="#021404"/>
    </radialGradient>

    <!-- Matrix Code Stream Gradient -->
    <linearGradient id="codeStream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FF66" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Digital Camo Body Pattern -->
    <pattern id="matrixCamo" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#0A3A10"/>
      <rect x="0" y="0" width="8" height="8" fill="#145A1E"/>
      <rect x="8" y="8" width="8" height="8" fill="#00C853" opacity="0.3"/>
      <rect x="4" y="4" width="4" height="4" fill="#00FF66" opacity="0.5"/>
    </pattern>

    <linearGradient id="matrixBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="50%" stop-color="#008537"/>
      <stop offset="100%" stop-color="#004D1A"/>
    </linearGradient>

    <linearGradient id="matrixFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#69F0AE"/>
      <stop offset="100%" stop-color="#00C853"/>
    </linearGradient>
  </defs>

  <style>
    .el{transform-box:fill-box;transform-origin:center}
    .bob{animation:bob 2.8s ease-in-out infinite}
    .blink{animation:blink 3.8s steps(1,end) infinite}
    .ear-twitch{animation:twitch 3.2s ease-in-out infinite alternate}
    .matrix-rain{animation:rain 2s linear infinite}
    .grid-glow{animation:gridGlow 2s ease-in-out infinite alternate}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%,98%{transform:scaleY(.1)}}
    @keyframes twitch{0%,90%,100%{transform:rotate(0deg)}94%{transform:rotate(-4deg)}97%{transform:rotate(3deg)}}
    @keyframes rain{0%{transform:translateY(-20px)}100%{transform:translateY(20px)}}
    @keyframes gridGlow{0%{opacity:0.4}100%{opacity:0.9}}
    @media(prefers-reduced-motion:reduce){.el{animation:none!important}}
  </style>

  <!-- Card Background -->
  <rect width="128" height="128" rx="20" fill="url(#matrixJackBg)"/>

  <!-- Falling Matrix Digital Rain Overlay -->
  <g opacity="0.4" class="matrix-rain" stroke="#00FF66" stroke-width="1" stroke-dasharray="2,4" font-family="monospace" font-size="6">
    <text x="12" y="20" fill="#00FF66">10110</text>
    <text x="24" y="50" fill="#69F0AE">01001</text>
    <text x="96" y="30" fill="#00FF66">11010</text>
    <text x="106" y="80" fill="#69F0AE">00110</text>
    <text x="8" y="90" fill="#00FF66">10011</text>
    <line x1="16" y1="0" x2="16" y2="128"/>
    <line x1="40" y1="0" x2="40" y2="128"/>
    <line x1="88" y1="0" x2="88" y2="128"/>
    <line x1="112" y1="0" x2="112" y2="128"/>
  </g>

  <!-- Ambient Green Matrix Glow -->
  <ellipse cx="64" cy="68" rx="46" ry="42" fill="#00FF66" opacity="0.25"/>

  <g class="el bob">
    <!-- Drop Shadow -->
    <ellipse cx="64" cy="118" rx="26" ry="6" fill="#000000" opacity="0.7"/>

    <!-- LEGS -->
    <rect x="42" y="104" width="13" height="10" rx="3" fill="#003311"/>
    <rect x="73" y="104" width="13" height="10" rx="3" fill="#00220A"/>

    <!-- MATRIX CHUNKY BODY -->
    <path d="M 34 38 C 32 24, 94 24, 94 38 L 94 96 C 94 104, 34 104, 34 96 Z" fill="url(#matrixBody)"/>
    <path d="M 34 38 C 32 24, 94 24, 94 38 L 94 96 C 94 104, 34 104, 34 96 Z" fill="url(#matrixCamo)" opacity="0.6"/>

    <!-- Wireframe Grid Lines on Body -->
    <path class="grid-glow" d="M 34 50 L 94 50 M 34 65 L 94 65 M 34 80 L 94 80 M 50 30 L 50 100 M 64 30 L 64 100 M 78 30 L 78 100" stroke="#00FF66" stroke-width="0.7" opacity="0.5"/>

    <!-- PALE MATRIX BELLY PATCH -->
    <ellipse cx="64" cy="74" rx="18" ry="20" fill="url(#matrixFace)" opacity="0.8"/>

    <!-- STUBBY ARMS -->
    <path d="M 34 68 L 24 72 L 34 76 Z" fill="#00E676"/>
    <path d="M 94 68 L 104 72 L 94 76 Z" fill="#00C853"/>

    <!-- ===================== MATRIX EARS ===================== -->
    <g class="el ear-twitch">
      <!-- Left Ear -->
      <path d="M 44 26 C 38 6, 42 -4, 48 4 C 54 12, 52 24, 54 26 Z" fill="#00A843"/>
      <path d="M 44 24 C 40 8, 44 2, 48 8 C 51 14, 50 22, 51 24 Z" fill="#69F0AE"/>

      <!-- Right Ear -->
      <path d="M 74 26 C 76 24, 74 12, 80 4 C 86 -4, 90 6, 84 26 Z" fill="#007A30"/>
      <path d="M 77 24 C 78 22, 77 14, 80 8 C 84 2, 88 8, 84 24 Z" fill="#69F0AE"/>

      <!-- Hair Tuft -->
      <ellipse cx="64" cy="22" rx="7" ry="5" fill="#00FF66"/>
    </g>

    <!-- ===================== HEADBAND (RED / MATRIX TRIM) ===================== -->
    <rect x="31" y="24" width="66" height="8" rx="2" fill="#D32F2F"/>
    <rect x="31" y="24" width="66" height="3" rx="1" fill="#69F0AE" opacity="0.8"/>

    <!-- ===================== MATRIX BUNNY FACE ===================== -->
    <path d="M 36 32 C 34 22, 92 22, 92 32 C 92 58, 36 58, 36 32 Z" fill="url(#matrixFace)"/>

    <!-- NOSE -->
    <ellipse cx="64" cy="46" rx="3.5" ry="2.5" fill="#004D1A"/>

    <!-- BUCK TEETH -->
    <rect x="60" y="52" width="3.5" height="5" rx="1" fill="#FFFFFF" stroke="#00C853" stroke-width="0.5"/>
    <rect x="64.5" y="52" width="3.5" height="5" rx="1" fill="#FFFFFF" stroke="#00C853" stroke-width="0.5"/>

    <!-- SMILE LINE -->
    <path d="M 54 48 Q 64 54 74 48" stroke="#004D1A" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- ===================== EXPRESSIVE EYES ===================== -->
    <path d="M 44 28 C 40 40, 56 44, 62 42 C 68 40, 84 40, 82 28 C 80 22, 66 22, 63 26 C 60 22, 46 22, 44 28 Z" fill="#FFFFFF"/>

    <!-- MATRIX GLOW PUPILS -->
    <g class="el blink">
      <!-- Left Pupil -->
      <ellipse cx="52" cy="34" rx="4" ry="6" fill="#00FF66"/>
      <ellipse cx="52" cy="34" rx="2.5" ry="4" fill="#00A843"/>
      <circle cx="50" cy="31" r="1.5" fill="#FFFFFF"/>

      <!-- Right Pupil -->
      <ellipse cx="72" cy="34" rx="4" ry="6" fill="#00FF66"/>
      <ellipse cx="72" cy="34" rx="2.5" ry="4" fill="#00A843"/>
      <circle cx="70" cy="31" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Brow -->
    <path d="M 44 24 Q 52 20 60 25 Q 68 20 78 24" stroke="#004D1A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
