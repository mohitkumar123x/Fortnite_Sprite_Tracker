<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <style>.el{transform-box:fill-box;transform-origin:center}.spin{animation:spin 12s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.85}}@media(prefers-reduced-motion:reduce){.el{animation:none!important}}</style>
  <rect width="128" height="128" rx="28" fill="#3a2a0a"/>
  <g class="el spin">
    <circle cx="64" cy="64" r="34" stroke="#ffee58" stroke-width="6"/>
    <path d="M64 30 V44 M64 84 V98 M30 64 H44 M84 64 H98" stroke="#ffee58" stroke-width="6" stroke-linecap="round"/>
  </g>
  <circle class="el pulse" cx="64" cy="64" r="8" fill="#ffee58"/>
</svg>
