<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <style>
    .el { transform-box: fill-box; transform-origin: center; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .sway { animation: sway 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: .85; } }
    @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @media (prefers-reduced-motion: reduce) { .el { animation: none !important; } }
  </style>
  <rect width="128" height="128" rx="28" fill="#1a3a2a"/>
  <g class="el pulse">
    <path d="M64 20 L100 44 L100 80 L64 108 L28 80 L28 44 Z" fill="none" stroke="#4caf50" stroke-width="4" opacity=".8"/>
    <path d="M64 32 L90 50 L90 76 L64 96 L38 76 L38 50 Z" fill="#4caf50" opacity=".4"/>
    <circle class="el sway" cx="64" cy="64" r="16" fill="#81c784"/>
  </g>
</svg>