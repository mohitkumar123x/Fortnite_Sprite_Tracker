<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <defs>
    <!-- Gold Background Gradient -->
    <radialGradient id="goldBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#8D6E63" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#3E2723" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1A0C03"/>
    </radialGradient>

    <!-- Metallic Gold Body Gradient -->
    <linearGradient id="goldBody" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="30%" stop-color="#FFD54F"/>
      <stop offset="70%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <!-- Metallic Gold Fur/Skin Gradient -->
    <linearGradient id="goldSkin" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="50%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFCA28"/>
    </linearGradient>

    <!-- Gold Shimmer Overlay -->
    <linearGradient id="goldShimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFDE7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .el{transform-box:fill-box;transform-origin:center}
    .bob{animation:bob 2.8s ease-in-out infinite}
    .blink{animation:blink 3.8s steps(1,end) infinite}
    .shimmer{animation:shimmer 2.5s ease-in-out infinite}
    .tail-wag{animation:wag 1.8s ease-in-out infinite alternate}
    .glow{animation:glow 3s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%,98%{transform:scaleY(.1)}}
    @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
    @keyframes wag{0%{transform:rotate(-8deg)}100%{transform:rotate(12deg)}}
    @keyframes glow{0%,100%{opacity:.3}50%{opacity:.6}}
    @media(prefers-reduced-motion:reduce){.el{animation:none!important}}
  </style>

  <!-- Card background -->
  <rect width="128" height="128" rx="20" fill="url(#goldBg)"/>

  <!-- Ambient golden glow behind Gold Tails -->
  <ellipse class="glow" cx="64" cy="68" rx="48" ry="44" fill="#FFD54F"/>

  <g class="el bob">
    <!-- Drop Shadow under character -->
    <ellipse cx="64" cy="118" rx="26" ry="6" fill="#000000" opacity="0.5"/>

    <!-- GOLD TWIN TAILS -->
    <g class="el tail-wag" style="transform-origin: 85px 80px;">
      <path d="M 86 70 C 104 60, 122 75, 114 92 C 104 100, 88 92, 84 82 Z" fill="url(#goldBody)"/>
      <path d="M 104 74 C 118 78, 114 92, 104 92 Z" fill="#FFFDE7"/>

      <path d="M 82 80 C 100 75, 118 88, 108 104 C 96 110, 82 100, 80 90 Z" fill="#E65100"/>
      <path d="M 98 88 C 112 92, 108 104, 98 104 Z" fill="#FFF59D"/>
    </g>

    <!-- GOLD CHUNKY BODY -->
    <path d="M 32 36 C 30 20, 86 20, 88 36 L 90 94 C 90 106, 30 106, 30 94 Z" fill="url(#goldBody)"/>
    <path d="M 32 36 C 30 20, 56 22, 46 96 C 34 94, 30 84, 32 36 Z" fill="#FFFDE7" opacity="0.6"/>
    <path d="M 72 26 C 84 32, 88 50, 88 94 C 76 96, 74 60, 72 26 Z" fill="#E65100" opacity="0.45"/>

    <!-- GOLD EARS -->
    <path d="M 34 30 L 26 8 L 48 22 Z" fill="#FFB300"/>
    <path d="M 36 26 L 30 14 L 44 21 Z" fill="url(#goldSkin)"/>
    <path d="M 72 22 L 90 8 L 84 30 Z" fill="#F57F17"/>
    <path d="M 75 21 L 86 14 L 81 26 Z" fill="#FFE082"/>

    <!-- GOLD HAIR TUFTS -->
    <path d="M 44 22 C 42 10, 54 10, 52 24 C 50 12, 64 12, 60 26 C 58 14, 70 16, 66 26 Z" fill="#FFB300"/>
    <path d="M 46 22 C 45 14, 53 14, 51 24 C 50 16, 61 16, 58 26 Z" fill="#FFFDE7" opacity="0.7"/>

    <!-- GOLD AVIATOR GOGGLES -->
    <rect x="28" y="24" width="62" height="4" fill="#3E2723"/>
    <rect x="36" y="18" width="18" height="14" rx="3" fill="#5D4037" stroke="#3E2723" stroke-width="1.5"/>
    <rect x="38" y="20" width="14" height="10" rx="2" fill="#FFE082"/>
    <rect x="62" y="18" width="18" height="14" rx="3" fill="#5D4037" stroke="#3E2723" stroke-width="1.5"/>
    <rect x="64" y="20" width="14" height="10" rx="2" fill="#FFE082"/>

    <!-- GOLD CHEST PATCH -->
    <ellipse cx="46" cy="74" rx="16" ry="15" fill="url(#goldSkin)"/>

    <!-- GOLD CHEEK TUFTS -->
    <path d="M 32 44 L 16 46 L 30 52 L 18 56 L 32 60 L 22 64 L 34 66 Z" fill="url(#goldSkin)"/>
    <path d="M 76 44 L 90 46 L 78 52 L 88 56 L 76 60 L 84 64 L 74 66 Z" fill="url(#goldSkin)"/>

    <!-- NOSE -->
    <ellipse cx="46" cy="50" rx="3" ry="2" fill="#3E2723"/>

    <!-- SMILE -->
    <path d="M 42 56 Q 46 60 50 56" stroke="#3E2723" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- CONNECTED EYES -->
    <path d="M 36 30 C 32 44, 52 50, 60 46 C 66 43, 76 42, 74 30 C 72 22, 58 22, 54 28 C 50 22, 38 22, 36 30 Z" fill="#FFFDE7"/>

    <!-- CYAN PUPILS -->
    <g class="el blink">
      <ellipse cx="46" cy="38" rx="4.5" ry="7" fill="#00BCD4"/>
      <ellipse cx="46" cy="38" rx="2.5" ry="5" fill="#00838F"/>
      <circle cx="44" cy="35" r="1.5" fill="#FFFFFF"/>

      <ellipse cx="64" cy="38" rx="4.5" ry="7" fill="#00BCD4"/>
      <ellipse cx="64" cy="38" rx="2.5" ry="5" fill="#00838F"/>
      <circle cx="62" cy="35" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- GOLD SHOES -->
    <rect x="36" y="94" width="12" height="12" rx="3" fill="#F57F17"/>
    <rect x="32" y="102" width="18" height="12" rx="4" fill="#FFB300"/>
    <rect x="32" y="102" width="18" height="4" rx="2" fill="#FFFDE7"/>

    <rect x="58" y="94" width="12" height="12" rx="3" fill="#E65100"/>
    <rect x="56" y="102" width="18" height="12" rx="4" fill="#F57F17"/>
    <rect x="56" y="102" width="18" height="4" rx="2" fill="#FFFDE7"/>

    <!-- Metallic Gold Shimmer Sweep -->
    <rect class="shimmer" x="20" y="30" width="20" height="70" fill="url(#goldShimmerGrad)" transform="rotate(-30 40 60)" opacity="0.7"/>

  </g>
</svg>
