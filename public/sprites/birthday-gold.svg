<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <style>
    .el { transform-box: fill-box; transform-origin: center; }
    .bob { animation: bob 2.8s ease-in-out infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .scan { animation: scan 3s ease-in-out infinite; }
    .glow { animation: glow 2s ease-in-out infinite; }
    .wag { animation: wag 1.1s ease-in-out infinite; }
    .floaty { animation: floaty 3.6s ease-in-out infinite; }
    .spark { animation: spark 2s ease-in-out infinite; }
    .blink { animation: blink 3.8s steps(1, end) infinite; }
    .chew { animation: chew 3.6s ease-in-out infinite; }
    .wave-arm { animation: wave-arm 6s ease-in-out infinite; }
    .sway-arm { animation: sway-arm 3.4s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: .85; } }
    @keyframes scan { 0%,100% { transform: translateY(0); opacity: .6; } 50% { transform: translateY(8px); opacity: 1; } }
    @keyframes glow { 0%,100% { opacity: .14; } 50% { opacity: .32; } }
    @keyframes wag { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes spark { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.25); opacity: .7; } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95%,98% { transform: scaleY(.1); } }
    @keyframes chew { 0%,74%,100% { transform: scaleY(1); } 84% { transform: scaleY(.7); } 92% { transform: scaleY(1.06); } }
    @keyframes wave-arm { 0%,100% { transform: rotate(0deg); } 6% { transform: rotate(-76deg); } 16% { transform: rotate(-56deg); } 26% { transform: rotate(-80deg); } 36% { transform: rotate(-58deg); } 46% { transform: rotate(-74deg); } 56% { transform: rotate(0deg); } }
    @keyframes sway-arm { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-14deg); } }
    @media (prefers-reduced-motion: reduce) { .el { animation: none !important; } }</style>
