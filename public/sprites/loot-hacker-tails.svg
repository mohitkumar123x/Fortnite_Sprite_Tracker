<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <style>
    .el { transform-box: fill-box; transform-origin: center; }
    .bob { animation: bob 2.8s ease-in-out infinite; }
    .floaty { animation: floaty 3.6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { .el { animation: none !important; } }
  </style>
  <rect width="128" height="128" rx="28" fill="#3a2a1a"/>
  <g class="el bob">
    <circle cx="64" cy="56" r="24" fill="#ffb74d"/>
    <circle cx="56" cy="52" r="6" fill="#fff"/>
    <circle cx="72" cy="52" r="6" fill="#fff"/>
    <circle cx="56" cy="52" r="3" fill="#1a1a1a"/>
    <circle cx="72" cy="52" r="3" fill="#1a1a1a"/>
    <path d="M56 66 Q64 74 72 66" stroke="#1a1a1a" stroke-width="2" fill="none"/>
    <g class="el floaty">
      <ellipse cx="64" cy="88" rx="12" ry="8" fill="#ff9800"/>
      <ellipse cx="64" cy="84" rx="8" ry="6" fill="#ffb74d"/>
    </g>
    <text x="64" y="68" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" opacity="0">LH</text>
  </g>
</svg>